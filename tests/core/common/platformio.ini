[platformio]
src_dir = ../../../src

[env:test_common_l1]
platform = native
test_framework = unity
lib_extra_dirs = ../native
lib_deps =
    bblanchon/ArduinoJson@^7.3.1
build_flags =
    -DESP8266
    --coverage
    -lgcov
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
    -DARDUINOJSON_ENABLE_ARDUINO_PRINT=1
    -DARDUINOJSON_ENABLE_STD_STRING=1
