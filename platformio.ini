; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectco[platfor
[platformio]
data_dir = ./data 
src_filter = +<*> -<.git/> -<.vscode/> -<module_*/> -<submodule_*/> 
extra_configs =
	targets/targets_example.ini
	targets/targets_user.ini

; All env
; Common settings will be applied to all env
[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
	bblanchon/ArduinoJson@^7.3.1
	esphome/ESPAsyncWebServer-esphome@^3.3.0
extra_scripts = 
	pre:python/version_builder.py 
	pre:python/module_version_gen.py
    pre:python/fs_builder.py
	pre:python/set_fs_data_dir.py
    post:python/copy_fw.py
    post:python/copy_fs.py
build_flags=
	-D CONNECTION_LED=-1
	-D AP_ENABLE_BUTTON=-1
	; -D DEBUG_LED
	;  -D DEBUG_EDITOR
	;  -D DEBUG_JSON
	;  -D DEBUG_NTP
	 -D DEBUG_OTA
	;  -D DEBUGLOG_WIFI




# ------------------------- COMMON ESP826 CHIPS ALL DEFINITIONS -----------------
[env:esp8266]
platform = espressif8266
src_filter = ${platformio.src_filter} 
board = d1_mini
lib_deps =
	${env.lib_deps} 
	ESPAsyncUDP
	LittleFS
build_flags = 
	${env.build_flags} 
    -D CONNECTION_LED=2
    -D USE_LITTLEFS
board_build.fs_size = 2MB
board_build.filesystem = littlefs
board_build.flash_size = 4MB
board_build.ldscript = eagle.flash.4m2m.ld
# ------------------------- COMMON ESP32 CHIPS ALL DEFINITIONS -----------------

[env:esp32]
platform = espressif32
board = upesy_wroom
src_filter = ${platformio.src_filter}
lib_deps =
	${env.lib_deps} 
	esphome/AsyncTCP-esphome@^2.1.4
build_flags=
	${env.build_flags}
    -D CONNECTION_LED=2         ; для uPesy ESP32 Wroom
    -D USE_LITTLEFS
board_build.partitions = partitions_esp32.csv 
board_build.filesystem = littlefs



# ------------------------- COMMON ESP32CAM BOARDS DEFINITIONS -----------------
# KRAMS
[env:esp32cam]
extends = env:esp32
board = esp32cam
build_flags = 
	${env.build_flags}
    -D CONNECTION_LED=4
    -D USE_LITTLEFS
monitor_dtr = 1
monitor_rts = 0
monitor_filters = esp32_exception_decoder




