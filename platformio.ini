; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectco[platfor
[platformio]
data_dir = ./data 
src_filter = +<*> -<.git/> -<.vscode/> -<module_*/>

; All env
; Common settings will be applied to all env
[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions =
lib_deps =
	bblanchon/ArduinoJson@^7.3.1
	tzapu/WiFiManager@^2.0.17
	esphome/ESPAsyncWebServer-esphome@^3.3.0
extra_scripts = 
	pre:version_builder.py 
	pre:module_version_gen.py
    pre:fs_builder.py
	pre:set_fs_data_dir.py
    post:copy_fw.py
    post:copy_fs.py
build_flags=
	-D CONNECTION_LED=-1
	; -D DEBUG_LED
	; -D DEBUG_EDITOR
	 -D DEBUG_JSON
	 -D DEBUG_NTP
	 -D DEBUG_OTA
	 -D DEBUGLOG_WIFI




# ------------------------- COMMON ESP8266 ALL DEFINITIONS -----------------
[env:esp8266]
platform = espressif8266
board = d1_mini
build_flags = 
	${env.build_flags}
    -D CONNECTION_LED=2
lib_deps =
	${env.lib_deps}
	esphome/ESPAsyncTCP-esphome@^2.0.0
	me-no-dev/ESPAsyncUDP@0.0.0-alpha+sha.697c75a025
	


# ------------------------- COMMON ESP32 CHIPS ALL DEFINITIONS -----------------

[env:esp32]
platform = espressif32
board = upesy_wroom
build_flags = 
	${env.build_flags}
    -D CONNECTION_LED=2         ; для uPesy ESP32 Wroom
lib_deps =
	${env.lib_deps}
	esphome/AsyncTCP-esphome@^2.1.4



# ------------------------- COMMON ESP32CAM DEFINITIONS -----------------
# KRAMS
[env:esp32cam]
extends = env:esp32
board = esp32cam
build_flags = 
	${env.build_flags}
    -D CONNECTION_LED=4
monitor_dtr = 1
monitor_rts = 0
monitor_filters = esp32_exception_decoder




#------------------------- esp32 + swd -------------------------
[env:esp32-swd]
extends = env:esp32
src_filter = ${platformio.src_filter} +<module_prog_swd/> +<module_udp/>
build_flags=
	${env.build_flags}
	${env:esp32.build_flags}
	-D MODULE_UDP=1
	-D DEBUG_UDP
	-D PROGTYPE_SWD=1
	-D DEBUG_SWD=1
	-D SWDPIN_CLK=21 
	-D SWDPIN_DATA=19
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}

#------------------------- esp32 + isp -------------------------
[env:esp32-isp]
extends = env:esp32
src_filter = ${platformio.src_filter} +<module_prog_isp/> +<module_udp/>
build_flags=
	${env.build_flags}
	${env:esp32.build_flags}
	-D MODULE_UDP=1
	-D DEBUG_UDP
	-D PROGTYPE_ISP=1
	-D DEBUG_ISP=1
	-D PIN_MISO=19 
	-D PIN_MOSI=23 
	-D PIN_SCK=18  
	-D PIN_RST=5   
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}

#------------------------- esp32 + GPIO -------------------------
[env:esp32-gpio]
src_filter = ${platformio.src_filter} +<module_gpio/>
extends = env:esp32
build_flags=
	${env.build_flags}
	${env:esp32.build_flags}
	-D MODULE_GPIO=1
	;-D DEBUG_GPIO=1
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}

#------------------------- esp8266 + swd -------------------------
[env:esp8266-swd]
extends = env:esp8266
lib_ldf_mode = chain+
lib_compat_mode = strict
src_filter = ${platformio.src_filter} +<module_prog_swd/> +<module_udp/>
build_flags=
	${env.build_flags}
	${env:esp8266.build_flags}
	-D MODULE_UDP=1
	-D DEBUG_UDP
	-D PROGTYPE_SWD=1
	-D SWDPIN_CLK=5
	-D SWDPIN_DATA=4
	;-D DEBUG_SWD=1
lib_deps =
	${env.lib_deps}
 	${env:esp8266.lib_deps}
	

#------------------------- esp8266 + isp -------------------------
[env:esp8266-isp]
extends = env:esp8266
src_filter = ${platformio.src_filter} +<module_prog_isp/> +<module_udp/>
build_flags=
	${env.build_flags}
	${env:esp8266.build_flags}
	-D MODULE_UDP=1
	-D DEBUG_UDP
	-D PROGTYPE_ISP=1
	;-D DEBUG_ISP=1
	-D PIN_MISO=12  
	-D PIN_MOSI=13  
	-D PIN_SCK=14   
	-D PIN_RST=5    
lib_deps =
	${env.lib_deps}
	${env:esp8266.lib_deps}

#------------------------- esp8266 + GPIO -------------------------
[env:esp8266-gpio]
src_filter = ${platformio.src_filter} +<module_gpio/>
extends = env:esp8266
build_flags=
	${env.build_flags}
	${env:esp8266.build_flags}
	-D MODULE_GPIO=1
	;-D DEBUG_GPIO
lib_deps =
	${env.lib_deps}
 	${env:esp8266.lib_deps}


#------------------------- Ogurez -------------------------
; ESP32-C3 Super Mini
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
monitor_speed = 115200
build_flags=
	${env.build_flags}
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	${env.lib_deps}
	esphome/AsyncTCP-esphome@^2.1.4


#------------------------- esp32 TestSolo -------------------------
[env:TestSolo]
extends = env:esp32
src_filter = ${platformio.src_filter}  +<module_udp/>
build_flags=
	${env.build_flags}
	${env:esp32.build_flags}
	-D MODULE_UDP=1
	-D DEBUG_UDP
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}
