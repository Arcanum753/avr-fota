name: PlatformIO CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [esp32cam, esp32wroom, d1_mini_pro]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache PlatformIO dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.platformio
          .pio
        key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-

    # Явная установка ESP8266 для d1_mini_pro
    - name: Pre-install ESP8266 platform
      if: matrix.env == 'd1_mini_pro'
      run: pio platform install espressif8266

    # Основное действие PlatformIO
    - name: PlatformIO CI
      uses: platformio/action-platformio-ci@v3
      with:
        platform: espressif32
        environments: ${{ matrix.env }}
