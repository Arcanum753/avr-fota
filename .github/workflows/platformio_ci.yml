name: PlatformIO CI

# Сборка ядра без внешних компонентов: module_*/submodule_*/device_* в клоне
# отсутствуют (это отдельные репозитории), поэтому в матрице только env,
# определённые в корневом platformio.ini.
#
# TestCore32/TestCore8266 здесь не собираются: их проверяет L3 compile matrix
# в tests-core.yml (env из targets/targets_core.ini).

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        env: [esp32, esp8266, esp32cam]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Полная история: версии модулей считаются по git-хешам коммитов.
        fetch-depth: 0

    - name: Cache PlatformIO dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.platformio
          .pio
        key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'targets/*.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      # intelhex/pyelftools нужны esp32-сборке (bootloader.bin, анализ ELF).
      run: pip install --upgrade platformio intelhex pyelftools

    # Платформа ставится явно, чтобы кэш ~/.platformio наполнялся предсказуемо
    # и сборка не зависела от автоустановки при первом pio run.
    - name: Install ESP32 platform
      if: matrix.env != 'esp8266'
      run: pio pkg install --global --platform "platformio/espressif32@7.0.1"

    - name: Install ESP8266 platform
      if: matrix.env == 'esp8266'
      run: pio pkg install --global --platform "platformio/espressif8266@4.2.1"

    # src/modules_registry.cpp генерируется под текущий env pre-скриптом
    # python/1_registry_pre_build.py (без #if defined) — отдельный шаг не нужен.
    - name: Build for ${{ matrix.env }}
      id: build-step
      run: pio run -e ${{ matrix.env }}

    - name: Upload build logs on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ matrix.env }}-${{ github.run_id }}
        path: |
          .pio/build/${{ matrix.env }}/**/*.log
          .pio/logs/*
        retention-days: 7
