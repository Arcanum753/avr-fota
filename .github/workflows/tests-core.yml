name: Core unit tests

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

jobs:
  core-tests:
    name: Core L1+L2+L3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: |
          pip install platformio gcovr pytest

      - name: Run core tests (orchestrator)
        run: bash tests/scripts/run_core.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: test_reports/
          retention-days: 14

  core-http:
    name: Core L4 (real device)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, device]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: pip install platformio pytest

      - name: Run core tests with device
        env:
          DEVICE_HOST: ${{ secrets.DEVICE_HOST }}
          DEVICE_USER: ${{ secrets.DEVICE_USER }}
          DEVICE_PASS: ${{ secrets.DEVICE_PASS }}
        run: bash tests/scripts/run_core.sh --with-device --no-l3
