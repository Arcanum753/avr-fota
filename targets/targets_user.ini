#------------------------- esp32 TestSolo -------------------------
[env:TestSolo32]
extends = env:esp32
src_filter = ${platformio.src_filter}  +<module_udp/>
build_flags=
	${env.build_flags}
	${env:esp32.build_flags}
	-D MODULE_UDP=1
	-D DEBUG_UDP
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}
#------------------------- esp8266 TestSolo -------------------------
[env:TestSolo8266]
extends = env:esp8266
src_filter = ${platformio.src_filter}  +<module_udp/>
build_flags=
	${env.build_flags}
	${env:esp8266.build_flags}
	-D MODULE_UDP=1
	-D DEBUG_UDP
lib_deps =
	${env.lib_deps}
	${env:esp8266.lib_deps}
