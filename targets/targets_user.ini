

#------------------------- esp32 TestSolo+cOTA  + LCD 2004 pcf-------------------------
[env:Test32_cOta_lcd_rgb]
extends = env:esp32
src_filter = ${env:esp32.src_filter}  +<module_udp/> +<module_otaclient/> +<module_lcd-i2c/>  +<module_rgb/>
build_flags=
	${env.build_flags}
	${env:esp32.build_flags}
	-D MODULE_UDP=1
	-D MODULE_OTACLIENT=1
	-D MODULE_LCD_I2C=1
	-D DEBUG_OTA
	-D DEBUG_OTACLIENT
	-D DEBUG_LCD
	-D MODULE_RGB=1
	-D DEBUG_RGB=1
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}
	marcoschwartz/LiquidCrystal_I2C


#------------------------- esp8266 TestSolo+cOTA + LCD 2004 pcf-------------------------
[env:Test8266_cOta_lcd_rgb]
extends = env:esp8266
src_filter = ${env:esp8266.src_filter}  +<module_udp/> +<module_otaclient/> +<module_lcd-i2c/>   +<module_rgb/>
build_flags=
	${env.build_flags}
	${env:esp8266.build_flags}
	-D MODULE_UDP=1
	-D MODULE_LCD_I2C=1
	-D DEBUG_LCD
	-D DEBUG_OTA
	-D MODULE_OTACLIENT=1
	-D DEBUG_OTACLIENT
	-D MODULE_RGB=1
	-D DEBUG_RGB=1
lib_deps =
	${env.lib_deps}
	${env:esp8266.lib_deps}
	marcoschwartz/LiquidCrystal_I2C


	#------------------------- esp32 clock simple-------------------------
[env:esp32_clock-mech]
extends = env:esp32
src_filter = ${env:esp32.src_filter} +<module_udp/> +<module_otaclient/> +<module_i2c-mapper/> +<device_clock-mech/> +<module_ds3231/>
build_flags=
	${env.build_flags}
	${env:esp32.build_flags}
	-D MODULE_UDP=1
	-D MODULE_OTACLIENT=1
	-D DEBUG_OTACLIENT
	-D DEBUG_OTA
	-D DEBUG_LCD
	-D MODULE_I2C_MAPPER=1
	-D DEVICE_CLOCKMECH=1
	-D DEBUG_CLOCKMECH
	-D MODULE_DS3231=1
	-D DEBUG_DS3231=1
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}

	#------------------------- esp32 clock with ring -------------------------
[env:esp32_clock-mech_ring]
extends = env:esp32
src_filter = ${env:esp32.src_filter} +<module_udp/> +<module_otaclient/> +<module_i2c-mapper/> +<device_clock-mech/> +<module_ds3231/> +<device_mech-ring/> 
build_flags=
	${env.build_flags}
	${env:esp32.build_flags}
	-D MODULE_UDP=1
	-D MODULE_OTACLIENT=1
	-D DEBUG_OTACLIENT
	-D DEBUG_OTA
	-D DEBUG_LCD
	-D MODULE_I2C_MAPPER=1
	-D DEVICE_CLOCKMECH=1
	-D DEBUG_CLOCKMECH
	-D DEVICE_RINGMECH=1
	-D DEBUG_RINGMECH
	-D MODULE_DS3231=1
	-D DEBUG_DS3231=1
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}

