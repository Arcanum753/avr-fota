# targets/targets_core.ini
#
# Ядровые env «без внешних компонентов» — всегда подключены (platformio.ini,
# extra_configs). Не требуют клонирования module_*/submodule_*/device_*:
# src_filter берётся из базовых env esp32/esp8266, которые исключают эти каталоги.
#
# Используются в CI (L3 compile matrix, tests/compile_matrix/envs.txt) и локально
# для проверки ядра. НЕ добавляйте сюда env, зависящие от внешних компонентов.

#------------------------- esp32 TestCore -------------------------
[env:TestCore32]
extends = env:esp32
src_filter = ${env:esp32.src_filter}
build_flags=
	${env.build_flags}
	${env:esp32.build_flags}
	-D DEBUG_NTP
	-D DEBUG_OTA
	-D DEBUG_CORE_WIFI
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}


#------------------------- esp8266 TestCore -------------------------
[env:TestCore8266]
extends = env:esp8266
src_filter = ${env:esp8266.src_filter}
build_flags=
	${env.build_flags}
	${env:esp8266.build_flags}
	-D DEBUG_LED
	-D DEBUG_NTP
	-D DEBUG_OTA
	-D DEBUG_CORE_WIFI
	-D DEBUG_ESP_UPDATER
lib_deps =
	${env.lib_deps}
	${env:esp8266.lib_deps}
