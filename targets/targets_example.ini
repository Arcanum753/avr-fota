
#------------------------- esp32 TestSolo -------------------------
[env:TestSolo32]
extends = env:esp32
src_filter = ${env:esp32.src_filter}  
build_flags=
	${env.build_flags}
	${env:esp32.build_flags}
	; -D DEBUG_EDITOR
	; -D DEBUG_JSON
	-D DEBUG_NTP
	-D DEBUG_OTA
	-D DEBUGLOG_WIFI
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}


#------------------------- esp8266 TestSolo -------------------------
[env:TestSolo8266]
extends = env:esp8266
src_filter = ${env:esp8266.src_filter}  
build_flags=
	${env.build_flags}
	${env:esp8266.build_flags}
	-D DEBUG_LED
	; -D DEBUG_EDITOR
	; -D DEBUG_JSON
	-D DEBUG_NTP
	-D DEBUG_OTA
	-D DEBUGLOG_WIFI
	-D DEBUG_ESP_UPDATER
	
lib_deps =
	${env.lib_deps}
	${env:esp8266.lib_deps}


#------------------------- esp32 TestSolo+cOTA -------------------------
[env:Test32_cOta]
extends = env:esp32
src_filter = ${env:esp32.src_filter}  +<module_udp/> +<module_otaclient/>
build_flags=
	${env.build_flags}
	${env:esp32.build_flags}
	-D MODULE_UDP=1
	-D DEBUG_UDP
	-D MODULE_OTACLIENT=1
	-D DEBUG_OTACLIENT
	; -D DEBUG_EDITOR
	; -D DEBUG_JSON
	-D DEBUG_NTP
	-D DEBUG_OTA
	-D DEBUGLOG_WIFI
	-D DEBUG_OTACLIENT
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}

#------------------------- esp8266 TestSolo+cOTA -------------------------
[env:Test8266_cOta]
extends = env:esp8266
src_filter = ${env:esp8266.src_filter}  +<module_udp/> +<module_otaclient/>
build_flags=
	${env.build_flags}
	${env:esp8266.build_flags}
	-D MODULE_UDP=1
	-D DEBUG_UDP
	-D MODULE_OTACLIENT=1
	-D DEBUG_OTACLIENT
	; -D DEBUG_EDITOR
	; -D DEBUG_JSON
	-D DEBUG_NTP
	-D DEBUG_OTA
	-D DEBUGLOG_WIFI
	-D DEBUG_OTACLIENT
lib_deps =
	${env.lib_deps}
	${env:esp8266.lib_deps}



#------------------------- Ogurez -------------------------
; ESP32-C3 Super Mini
[env:esp32-c3-devkitm-1]
src_filter = ${platformio.src_filter} 
platform = espressif32
board = esp32-c3-devkitm-1
monitor_speed = 115200
build_flags=
	${env.build_flags}
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	${env.lib_deps}
	esphome/AsyncTCP-esphome@^2.1.4

