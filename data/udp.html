<!DOCTYPE html>
<html>

<head>
    <title>UDP Settings</title>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<link rel="stylesheet" href="style.css">
</head>

<body>
    <markup>./page_head.html</markup>
    <h2 class="title" style="background: #7D8EE2"> <span id="devicename"></span> UDP Configuration</h2>
    
    <form action="" method="post">
        <table border="0" cellspacing="0" cellpadding="3" align="center">
            <tr><td align="left">Udp TX (broadcast) port</td>    <td><input type="text" id="udpporttx"    name="udpporttx" value=""></td></tr>
            <tr><td align="left">Udp RX broadcast port</td>    <td><input type="text" id="udpportrx"    name="udpportrx" value=""></td></tr>
            <tr><td align="left">Udp key word</td>    <td><input type="text" id="udpkeyword"    name="udpkeyword" value=""></td></tr>
            <tr><td align="left">Udp broadcast every ... minute (0 is off)</td>    <td><input type="number" id="udptime" name="udptime"  min="0" max="60" value=""  onkeyup=setMinMax();></td></tr>
            <tr><td colspan="2" align="center"> <input type="submit" value="Save"></td></tr>
        </table>
    </form>

    <form id="upload" onsubmit="event.preventDefault(); udpTxTest()" enctype="multipart/form-data" autocomplete="off">
        <table align="center">
            <tr> <td align="center"> <span title="Test udp broadcast message.">
                    <input id="updateFirmware" type='submit' value='Test udp TX' >
                </span> </td></tr>

        </table>
    </form>

	<markup>./page_bottom.html</markup>
	<script src="GetJson.js" defer></script>
	<script src="GetMarkup.js" defer></script>
    <script src="microajax.js" defer></script>
	<script>
		window.onload = function() {
			setTimeout(() => {
				ApplyCVT("/system/version");
                ApplyCVT("/udp/info");
			}, 100);
			
		};

		function udpTxTest(){
            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/udp/test');
            xhr.send();
            console.log("udpTxTest();");
        }
		function setMinMax() {
            const el = document.getElementById("udptime");
            if (el.value != "") {
                if (parseInt(el.value) < parseInt(el.min)) {
                    el.value = el.min;
                }
                if (parseInt(el.value) > parseInt(el.max)) {
                    el.value = el.max;
                }
            }
        };
		</script>
</body>

</html>
