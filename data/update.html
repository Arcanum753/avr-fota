<!DOCTYPE html>
<html>
<head>
	<title>ESP Firmware &amp FS OTA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<link rel="stylesheet" href="style.css">
	<script src="FSBrowserNG.js"></script>
</head>
<body>
    <markup>./page_head.html</markup>
    <h2 class="title" style="background: #7D8EE2; padding: 8px;"> ESP chip firmware &amp filesystem self update page</h2>
    <hr>
    <form method='POST' action='/update' enctype='multipart/form-data'>
        <table align = "center"> 
            <tr><td> <input id="fileName" type='file' name='update' onchange="summd5()" > </td> </tr>
            <tr><td id="md5row" hidden>
                    Calculated file MD5 hash: <span id="clientHash">Select a file</span><br>
                    Size: <span id="fileSize"></span> Bytes <br>
                    Filename: <span id="fileNameLoaded"></span>
                </td>
            <tr><td> <input id="updateButton" type='submit'   value='Update ESP chip firmware.' disabled > </td> </tr>
            </tr>
            
        </table>
    </form>

    <markup>./page_bottom.html</markup>
    <script src="GetMarkup.js" defer></script>
    <script src="GetJson.js" defer></script>
    <script src="microajax.js" defer></script>
    <script src="spark-md5.js" defer></script>
    <script> 
        window.onload = function () {
      	  	setTimeout(() => {
        			ApplyCVT("/system/infovalues");
                    ApplyCVT("/system/version");
      		}, 250);
        };

        var blobSlice = File.prototype.slice || File.prototype.mozSlice || File.prototype.webkitSlice,
                  input = document.getElementById('fileName'),
                  running = false,
                  ua = navigator.userAgent.toLowerCase();

        function summd5() {
            input = document.getElementById("fileName");
            if (running) {
                return;
            }
            if (!input.files.length) {
                console.error('Please select a file');
                return;
            }
            var fileReader = new FileReader(),
                    file = input.files[0],
                    time;
            fileReader.onload = function (e) {
                running = false;
                if (file.size != e.target.result.length) {
                    console.error('ERROR:Browser reported success but could not read the file until the end');
                } else {
                    md5hash = SparkMD5.hashBinary(e.target.result);
                    console.info('Finished loading!');
                    console.info('Computed hash: ' + md5hash); // compute hash
                    console.info('Total time: ' + (new Date().getTime() - time) + 'ms');
                    
                    document.getElementById('md5row').hidden = false;
                    
                    document.getElementById('clientHash').innerHTML = md5hash;
                    document.getElementById('fileSize').innerHTML = file.size;
                    document.getElementById('fileNameLoaded').innerHTML = file.name;
                    
                    setValues('/setmd5?md5=' + md5hash + '&size=' + file.size + '&name=' + file.name);
                    setTimeout(fileChechInfoGet, 250);
                }
            };
            fileReader.onerror = function () {
                running = false;
                console.error('ERROR: FileReader onerror was triggered, maybe the browser aborted due to high memory usage');
            };
            running = true;
            console.info('Starting normal test (' + file.name + ')');
            time = new Date().getTime();
            fileReader.readAsBinaryString(file);
        }
        
        function fileChechInfoGet() {
          const _buttonEn = document.getElementById('updateButton') ;
          const _buttonVal = document.getElementById('updateButton');
          let _filetype;
          let _filesize ;
          
          const xhr = new XMLHttpRequest();
          xhr.open('get', "/update/updatepossible")
          xhr.send();
          xhr.addEventListener('loadend', () => {
            const fieldsRows = ParseCVT(xhr.response).reverse();
            for (fields of fieldsRows) {
              if (fields[0] == "updFileType" ) {
                  _filetype = fields[1];
                } 
            }
            if (_filetype == "FIRMWARE"  ) {
                _buttonEn.disabled = false;
                _buttonVal.value = 'Update FIRMWARE';
            
            }
            if (_filetype == "FILESYSTEM"  ) {
              _buttonEn.disabled = false;
              _buttonVal.value = 'Update FILESYSTEM';
            }
            if (_filetype == "UNSUPPORTED"  ) {
              _buttonEn.disabled = true;
              _buttonVal.value = 'UNSUPPORTED FILE!';
            }
          });
        }
        
    </script>
   
</body>
</html>
