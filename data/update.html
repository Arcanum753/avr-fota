<!DOCTYPE html>
<html>
<head>
    <title>ESP Firmware &amp FS OTA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-type" content="text/html; charset=utf-8">
    <link rel="stylesheet" href="style.css">
    <script src="FSBrowserNG.js"></script>
</head>
<body>
    <markup>./page_head.html</markup>
    <h2 class="title" style="background: #7D8EE2; padding: 8px;"> ESP chip firmware &amp filesystem self update page</h2>
    <hr>
    
    <div id="progressContainer" style="text-align: center; margin: 10px 0; padding: 10px; background-color: #f0f0f0; border-radius: 5px; display: none;">
        <div id="progressText">Upload progress: 0%</div>
        <div style="width: 100%; background-color: #ddd; border-radius: 3px; margin-top: 5px;">
            <div id="progressBar" style="width: 0%; height: 20px; background-color: #4CAF50; border-radius: 3px; transition: width 0.3s;"></div>
        </div>
    </div>
    
    <form id="uploadForm" enctype='multipart/form-data'>
        <table align = "center"> 
            <tr><th> <input id="fileName" type='file' name='update' onchange="summd5()" style="display: block; margin: 20px auto; padding: 10px; font-size: 16px; width: auto; min-width: 300px;"> </th> </tr>
            <tr><td id="md5row" >
                    Calculated file MD5 hash: <span id="clientHash">Select a file</span><br>
                    Size: <span id="fileSize"></span> Bytes <br>
                    Filename: <span id="fileNameLoaded"></span>
                  </td>
            </tr>
            <tr><td id="VersionDiff" >
                     <span id="updStatus"> </span><br>
                     <span id="updSizeFree"> </span><br>
                     <span id="updSizeMax"> </span><br>
                     <span id="updFileType"> </span><br>
                     <span id="updVerDiffName"> </span><br>
                     <span id="updVerDiffMaj"> </span><br>
                     <span id="updVerDiffMinor"> </span><br>
                     <span id="updVerDiffDate"> </span><br>
                     <span id="updVerDiffBuild"> </span><br>
                     <span id="updIsDebug"> </span><br>
                     <span id="updFsCompare"> </span><br>
                     <span id="updFsCurrent"> </span><br>
                  </td>
            </tr>
            <tr><td> 
                <input id="updateButton" type='button' value='Update ESP chip firmware.' disabled onclick="uploadFile()">
                <label>
                    <input type="checkbox" id="ignoreCheck" onchange="updateButtonState()">Ignore validation and force upload </label>
              </td> </tr>
        </table>
    </form>

    <markup>./page_bottom.html</markup>
    <script src="GetMarkup.js" defer></script>
    <script src="GetJson.js" defer></script>
    <script src="microajax.js" defer></script>
    <script src="spark-md5.js" defer></script>
    <script> 
        let progressTimer = null;
        let isUploading = false;

        window.onload = function () {
            setTimeout(() => {
                    ApplyCVT("/system/infovalues");
                    ApplyCVT("/system/version");
            }, 250);
        };

        var blobSlice = File.prototype.slice || File.prototype.mozSlice || File.prototype.webkitSlice,
                  input = document.getElementById('fileName'),
                  running = false,
                  ua = navigator.userAgent.toLowerCase();

        let lastCheckResult = {
            canUpdate: false,
            fileType: "UNSUPPORTED",
            buttonText: ""
        };

        function stopProgressPolling() {
            if (progressTimer) {
                clearInterval(progressTimer);
                progressTimer = null;
            }
            isUploading = false;
        }

        function hideProgressBar() {
            document.getElementById('progressContainer').style.display = 'none';
            updateProgressDisplay(0);
        }

        function startProgressPolling() {
            document.getElementById('progressContainer').style.display = 'block';
            isUploading = true;
            
            if (progressTimer) {
                clearInterval(progressTimer);
                progressTimer = null;
            }
            
            progressTimer = setInterval(function() {
                if (!isUploading) {
                    stopProgressPolling();
                    return;
                }
                
                const xhr = new XMLHttpRequest();
                xhr.open('GET', '/update/progress', true);
                
                xhr.onload = function() {
                    if (xhr.status === 200) {
                        const fieldsRows = ParseCVT(xhr.response);
                        for (let fields of fieldsRows) {
                            if (fields[0] === "percent") {
                                const percent = parseInt(fields[1]);
                                updateProgressDisplay(percent);
                                
                                if (percent >= 100) {
                                    setTimeout(() => {
                                        if (isUploading) {
                                        }
                                    }, 2000);
                                }
                                break;
                            }
                        }
                    }
                };
                
                xhr.onerror = function() { 
                    console.error('Error fetching progress');
                    stopProgressPolling();
                    hideProgressBar();
                };
                
                xhr.send();
            }, 1000);
        }

        function updateProgressDisplay(percent) {
            const progressText = document.getElementById('progressText');
            const progressBar = document.getElementById('progressBar');
            
            if (progressText) {
                progressText.innerHTML = `Upload progress: ${percent}%`;
            }
            if (progressBar) {
                progressBar.style.width = percent + '%';
                if (percent < 30) {
                    progressBar.style.backgroundColor = '#ff4444';
                } else if (percent < 70) {
                    progressBar.style.backgroundColor = '#ffaa00';
                } else {
                    progressBar.style.backgroundColor = '#4CAF50';
                }
            }
        }

        function formatDateDiff(diffSeconds) {
            if (diffSeconds === 0) return "0 (same)";
            
            let absDiff = Math.abs(diffSeconds);
            let isOlder = diffSeconds < 0;
            let result = "";
            
            let years = Math.floor(absDiff / 31536000);
            absDiff %= 31536000;
            let months = Math.floor(absDiff / 2592000);
            absDiff %= 2592000;
            let days = Math.floor(absDiff / 86400);
            absDiff %= 86400;
            let hours = Math.floor(absDiff / 3600);
            absDiff %= 3600;
            let minutes = Math.floor(absDiff / 60);
            let seconds = absDiff % 60;
            
            if (years > 0) {
                result += years + "y ";
            }
            if (months > 0) {
                result += months + "m ";
            }
            if (days > 0) {
                result += days + "d ";
            }
            if (years === 0 && months === 0 && days === 0 && hours > 0) {
                result += hours + "h ";
            }
            if (years === 0 && months === 0 && days === 0 && hours === 0 && minutes > 0) {
                result += minutes + "min ";
            }
            if (years === 0 && months === 0 && days === 0 && hours === 0 && minutes === 0 && seconds > 0) {
                result += seconds + "s ";
            }
            
            result = result.trim();
            if (isOlder) {
                return result + " (older)";
            } else {
                return "+" + result + " (newer)";
            }
        }

        function formatBuildDiff(diff) {
            if (diff > 0) return "+" + diff + " (newer)";
            if (diff < 0) return diff + " (older)";
            return "0 (same)";
        }

        function formatVersionDiff(diff) {
            if (diff > 0) return "+" + diff + " (newer)";
            if (diff < 0) return diff + " (older)";
            return "0 (same)";
        }

        function formatFsCompare(value) {
            switch(value) {
                case "SAME": return "✓ Same version (OK)";
                case "NEWER": return "↑ Newer than current (OK)";
                case "OLDER": return "↓ Older than current (WARNING)";
                case "NO_JSON": return "⚠ No version_fs.json, comparing with firmware";
                default: return "Unknown: " + value;
            }
        }

        function summd5() {
            input = document.getElementById("fileName");
            if (running) { return; }
            if (!input.files.length) {
                console.error('Please select a file');
                return;
            }
            
            var fileReader = new FileReader(),
                file = input.files[0],
                time;
            
            fileReader.onload = function (e) {
                running = false;
                if (file.size != e.target.result.length) {
                    console.error('ERROR: Browser reported success but could not read the file until the end');
                } else {
                    md5hash = SparkMD5.hashBinary(e.target.result);
                    console.info('Finished loading!');
                    console.info('Computed hash: ' + md5hash);
                    console.info('Total time: ' + (new Date().getTime() - time) + 'ms');
                    
                    document.getElementById('md5row').hidden = false;
                    document.getElementById('clientHash').innerHTML = md5hash;
                    document.getElementById('fileSize').innerHTML = file.size;
                    document.getElementById('fileNameLoaded').innerHTML = file.name;
                    
                    const xhr = new XMLHttpRequest();
                    const url = '/update/setmd5?md5=' + encodeURIComponent(md5hash) + 
                                '&size=' + file.size + 
                                '&name=' + encodeURIComponent(file.name);
                    
                    xhr.open('GET', url, true);
                    
                    xhr.onload = function() {
                        if (xhr.status == 200) {
                            console.info('MD5 data sent successfully');
                            setTimeout(fileChechInfoGet, 250);
                        } else {
                            console.error('Error sending MD5 data: ' + xhr.status);
                        }
                    };
                    
                    xhr.onerror = function() {
                        console.error('Network error sending MD5 data');
                    };
                    
                    xhr.send();
                }
            };
            
            fileReader.onerror = function () {
                running = false;
                console.error('ERROR: FileReader onerror was triggered, maybe the browser aborted due to high memory usage');
            };
            
            running = true;
            console.info('Starting normal test (' + file.name + ')');
            time = new Date().getTime();
            fileReader.readAsBinaryString(file);
        }
                
        function fileChechInfoGet() {
            const updStatus = document.getElementById('updStatus');
            const updSizeFree = document.getElementById('updSizeFree');
            const updSizeMax = document.getElementById('updSizeMax');
            const updFileType = document.getElementById('updFileType');
            const updVerDiffName = document.getElementById('updVerDiffName');
            const updVerDiffMaj = document.getElementById('updVerDiffMaj');
            const updVerDiffMinor = document.getElementById('updVerDiffMinor');
            const updVerDiffDate = document.getElementById('updVerDiffDate');
            const updVerDiffBuild = document.getElementById('updVerDiffBuild');
            const updIsDebug = document.getElementById('updIsDebug');
            const updFsCompare = document.getElementById('updFsCompare');
            const updFsCurrent = document.getElementById('updFsCurrent');
            
            const xhr = new XMLHttpRequest();
            xhr.open('get', "/update/firmwarefilecheck");
            xhr.send();
            
            xhr.addEventListener('loadend', () => {
                const fieldsRows = ParseCVT(xhr.response);
                
                let fileType = "UNSUPPORTED";
                let nameMatch = "NO";
                let majorDiff = 0, minorDiff = 0, dateDiff = 0, buildDiff = 0, isDebug = 0;
                let status = "", sizeFree = "", sizeMax = "";
                let fsCompare = "", fsCurrentMajor = 0, fsCurrentMinor = 0, fsCurrentDate = 0, fsCurrentBuild = 0;
                
                for (let fields of fieldsRows) {
                    const key = fields[0];
                    const value = fields[1];
                    
                    switch(key) {
                        case "updStatus": 
                            status = value;
                            updStatus.innerHTML = "Status: " + value;
                            break;
                        case "updSizeFree": 
                            sizeFree = value;
                            updSizeFree.innerHTML = "Free space: " + value + " bytes";
                            break;
                        case "updSizeMax": 
                            sizeMax = value;
                            updSizeMax.innerHTML = "Max space: " + value + " bytes";
                            break;
                        case "updFileType": 
                            fileType = value;
                            updFileType.innerHTML = "File type: " + value;
                            break;
                        case "updVerDiffName": 
                            nameMatch = value;
                            updVerDiffName.innerHTML = "Device: " + value;
                            break;
                        case "updVerDiffMaj": 
                            majorDiff = parseInt(value);
                            updVerDiffMaj.innerHTML = "Major diff: " + formatVersionDiff(majorDiff);
                            break;
                        case "updVerDiffMinor": 
                            minorDiff = parseInt(value);
                            updVerDiffMinor.innerHTML = "Minor diff: " + formatVersionDiff(minorDiff);
                            break;
                        case "updVerDiffDate": 
                            dateDiff = parseInt(value);
                            updVerDiffDate.innerHTML = "Date diff: " + formatDateDiff(dateDiff);
                            break;
                        case "updVerDiffBuild": 
                            buildDiff = parseInt(value);
                            updVerDiffBuild.innerHTML = "Build diff: " + formatBuildDiff(buildDiff);
                            break;
                        case "updIsDebug": 
                            isDebug = parseInt(value);
                            updIsDebug.innerHTML = "Debug build: " + (isDebug ? "Yes" : "No");
                            break;
                        case "updFsCompare":
                            fsCompare = value;
                            updFsCompare.innerHTML = "FS vs Current: " + formatFsCompare(value);
                            break;
                        case "updFsCurrentMajor":
                            fsCurrentMajor = parseInt(value);
                            break;
                        case "updFsCurrentMinor":
                            fsCurrentMinor = parseInt(value);
                            break;
                        case "updFsCurrentDate":
                            fsCurrentDate = parseInt(value);
                            break;
                        case "updFsCurrentBuild":
                            fsCurrentBuild = parseInt(value);
                            updFsCurrent.innerHTML = "Current FS/FW: " + fsCurrentMajor + "." + fsCurrentMinor + "." + fsCurrentDate + "." + fsCurrentBuild;
                            break;
                    }
                }
                
                let canUpdate = true;
                let buttonText = "";
                
                if (nameMatch != "MATCHED") {
                    canUpdate = false;
                    buttonText = "WRONG DEVICE!";
                } else if (fileType == "UNSUPPORTED") {
                    canUpdate = false;
                    buttonText = "UNSUPPORTED FILE!";
                } else if (status != "OK") {
                    canUpdate = false;
                    buttonText = "INSUFFICIENT SPACE!";
                } else {
                    if (majorDiff < 0) {
                        canUpdate = false;
                        buttonText = "MAJOR IS OLDER!";
                    } else if (minorDiff < 0) {
                        canUpdate = false;
                        buttonText = "MINOR IS OLDER!";
                    } else {
                        // For filesystem, also check if OLDER than current FS
                        if (fileType == "FILESYSTEM" && fsCompare == "OLDER") {
                            canUpdate = false;
                            buttonText = "FS IS OLDER!";
                        } else {
                            buttonText = "Update " + fileType;
                        }
                    }
                }
                
                lastCheckResult = {
                    canUpdate: canUpdate,
                    fileType: fileType,
                    buttonText: buttonText
                };
                
                updateButtonState();
            });
        }

        function updateButtonState() {
            const _button = document.getElementById('updateButton');
            const ignoreCheck = document.getElementById('ignoreCheck');
            
            if (ignoreCheck.checked) {
                _button.disabled = false;
                _button.value = "Upload (forced)";
            } else {
                _button.disabled = !lastCheckResult.canUpdate;
                _button.value = lastCheckResult.buttonText || "Update ESP chip firmware.";
            }
        }

        function uploadFile() {
            const fileInput = document.getElementById('fileName');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select a file first');
                return;
            }
            
            startProgressPolling();
            
            const formData = new FormData();
            formData.append('update', file);
            
            const xhr = new XMLHttpRequest();
            
            xhr.open('POST', '/update', true);
            
            xhr.onload = function() {
                stopProgressPolling();
                
                if (xhr.status === 200) {
                    console.log('Upload successful');
                    
                    updateProgressDisplay(100);
                    
                    if (xhr.responseText.includes('no reboot')) {
                        // FS update on ESP32: no reboot needed, refresh version info
                        console.log('FS update: no reboot needed, refreshing version info');
                        document.getElementById('progressText').innerHTML = 'FS updated successfully! Refreshing version info...';
                        
                        setTimeout(() => {
                            hideProgressBar();
                            // Refresh version info on the page
                            ApplyCVT("/system/infovalues");
                            ApplyCVT("/system/version");
                            // Re-check the current file if still selected
                            const fileInput = document.getElementById('fileName');
                            if (fileInput.files.length > 0) {
                                setTimeout(fileChechInfoGet, 500);
                            }
                        }, 2000);
                    } else if (xhr.responseText.includes('refresh') || xhr.responseText.includes('Restarting')) {
                        setTimeout(() => {
                            window.location.href = '/index.html';
                        }, 3000);
                    } else {
                        alert('Update successful! Device will restart.');
                        setTimeout(() => {
                            hideProgressBar();
                        }, 2000);
                    }
                } else {
                    console.error('Upload failed:', xhr.status);
                    alert('Upload failed with status: ' + xhr.status);
                    hideProgressBar();
                }
            };
            
            xhr.onerror = function() {
                console.error('Network error during upload');
                alert('Network error during upload');
                stopProgressPolling();
                hideProgressBar();
            };
            
            xhr.ontimeout = function() {
                console.error('Upload timeout');
                alert('Upload timeout');
                stopProgressPolling();
                hideProgressBar();
            };
            
            xhr.send(formData);
        }

    </script>
   
</body>
</html>
