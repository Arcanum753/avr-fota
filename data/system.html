<!DOCTYPE html>
<html>

<head>
    <title>FSBrowserNG System Settings</title>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<link rel="stylesheet" href="style.css">
</head>

<body>
    <markup>./page_head.html</markup>
    <h2 class="title" style="background: #7D8EE2">System configuration</h2>
    <form action="" method="get">
        <table border="0" cellspacing="0" cellpadding="3" align="center">
            <tr><td align="left">Name of device</td>       <td><input type="text" id="name"   name="name" value=""></td></tr>
            <tr><td align="left">Device serial number</td> <td><input type="text" id="serial" name="serial" value=""></td></tr>
            <tr><td colspan="2" align="center"> <input type="submit" value="Save"></td></tr>
        </table>
    </form>
    <hr>
    <form id="wwwAuthForm" onsubmit=" return checkAuth( this ) " method="get">
        <input type="hidden" id="authconf" name="authconf" value="">
        <table border="0" cellspacing="0" cellpadding="3" style="width:350px" align="center">
            <tr><td><label for="wwwauth">Use auth:</label><input type="checkbox" id="wwwauth" name="wwwauth" onclick='javascript:enableAuthFields(this);'></td></tr>
            <tr id="username" style="display: none;"><td><label for="wwwuser">Web User:</label><input type="text" id="wwwuser" name="wwwuser" value=""></td></tr>
            <tr id="password" style="display: none;"><td><label for="wwwpass">Password:</label><input type="password" id="wwwpass" name="wwwpass" value=""></td></tr>
            <tr><td align="center" colspan="2">Notice password is used for<br/>HTTP Auth, AP Mode and OTA</td></tr>
            <tr><td align="center"><input type="submit" value="Save"></td></tr>
            <tr><td id="submitResult" align="center"></td></tr>
        </table>
    </form>
    <hr>
        <form>
        <table border="0" cellspacing="0" cellpadding="3" style="width:350px" align="center">
            <tr><td colspan="2" align="center"><input type="button" value="Restart" onclick='javascript:restartESP()'></td></tr>
        </table>
    </form>
    <hr>
    <markup>./page_bottom.html</markup>
    <script src="GetJson.js" defer></script>
    <script src="GetMarkup.js" defer></script>
    <script src="microajax.js" defer></script>

    <script>
            window.onload = function() {
                ApplyCVT("/system/devconf")
                    .then(() => ApplyCVT("/system/info"))
                    .then(() => ApplyCVT("/system/wwwauth"))
                    .then(() => enableAuthFields(document.getElementById("wwwauth")));
            };

        function enableAuthFields(cb) {
            let username_row = document.getElementById('username').style;
            let password_row = document.getElementById('password').style;
            if (cb.checked)
            {
                username_row.display = 'table-row';
                password_row.display = 'table-row';
            }
            else
            {
                username_row.display = 'none';
                password_row.display = 'none';
            }
        }
        function checkAuth(frm)
        {
            if (document.getElementById("wwwauth").checked)
            {
                if((document.getElementById("wwwuser").value == "") || (document.getElementById("wwwpass").value == ""))
                {
                    document.getElementById("submitResult").innerHTML = "User and password must be filled";
                    return false;
                }
            }
            else
            {
                document.getElementById("wwwuser").value = "";
                document.getElementById("wwwpass").value = "";
            }
            document.getElementById("wwwAuthForm").action = "/system/savewwwauth";
        }

        function restartESP() {
            setValues("/system/restart");
        }

        function GetState() {
            setValues("/system/wwwauth");
        }

       
    </script>
</body>

</html>
