<!DOCTYPE html>
<html>
<head>
    <title>Programmer project configuration</title>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<link rel="stylesheet" href="style.css">
</head>

<body>
    <markup>./page_head.html</markup>
    <h2 class="title" style="background: #7D8EE2">Programmer project configuration</h2>

    <div class="content" style="text-align: center;">
        <table class="scan" style="width: auto; margin: 0 auto;">
            <tr><th colspan="2">Project Configuration</th></tr>
            <tr><td class="label">Project name:</td>    <td><input type="text" id="progproj" value=""></td></tr>
            <tr><td class="label">Chip:</td>            <td><select id="progchip"></select></td></tr>
            <tr><td colspan="2" style="text-align: center; padding: 8px;"> <input type="button" value="Save" onclick="saveProject()" class="button-prog"></td></tr>
        </table>
    </div>

    <div id="chipinfo" style="display:none; margin-top: 10px; text-align: center;">
        <table class="scan" style="width: auto; margin: 0 auto;">
            <tr><th colspan="2">Chip Information</th></tr>
            <tr><td class="label">Name:</td>        <td id="chipinfo_name"></td></tr>
            <tr><td class="label">Signature:</td>    <td id="chipinfo_signature"></td></tr>
            <tr><td class="label">Flash size:</td>   <td id="chipinfo_flash"></td></tr>
            <tr><td class="label">Page size:</td>    <td id="chipinfo_page"></td></tr>
        </table>
    </div>
    
	<markup>./page_bottom.html</markup>
	<script src="GetJson.js" defer></script>
	<script src="GetMarkup.js" defer></script>
	<script>
		function loadChips(selectedChip) {
			return fetch('/project/chips')
				.then(response => response.json())
				.then(chips => {
					const sel = document.getElementById('progchip');
					sel.innerHTML = '';
					const emptyOpt = document.createElement('option');
					emptyOpt.value = '';
					emptyOpt.textContent = '-- Select chip --';
					sel.appendChild(emptyOpt);
					for (const chipName of chips) {
						const opt = document.createElement('option');
						opt.value = chipName;
						opt.textContent = chipName;
						sel.appendChild(opt);
					}
					if (selectedChip && selectedChip.length > 0) {
						sel.value = selectedChip;
					}
				});
		}

		window.onload = function() {
			setTimeout(() => {
				// Сначала загружаем список чипов (создаём option-ы в select)
				ApplyCVT("/system/version")
					.then(() => loadChips(''))
					.then(() => ApplyCVT("/project/info"))
					.then(() => showChipInfo());
			}, 500);
		};

		// При изменении выбора чипа — загружаем информацию о нём
		document.addEventListener('change', function(e) {
			if (e.target && e.target.id == 'progchip') {
				showChipInfo();
			}
		});

		function showChipInfo() {
			const sel = document.getElementById('progchip');
			if (!sel || !sel.value) {
				document.getElementById('chipinfo').style.display = 'none';
				return;
			}
			// Загружаем информацию о выбранном чипе
			fetch('/project/chipinfo?name=' + encodeURIComponent(sel.value))
				.then(response => response.text())
				.then(data => {
					// Парсим CVT-ответ
					const lines = data.split('\n');
					for (let line of lines) {
						if (!line.trim()) continue;
						const parts = line.split('|');
						if (parts.length >= 2) {
							const el = document.getElementById(parts[0]);
							if (el) el.textContent = parts[1];
						}
					}
					document.getElementById('chipinfo').style.display = 'block';
				})
				.catch(err => {
					console.error('Failed to load chip info:', err);
					document.getElementById('chipinfo').style.display = 'none';
				});
		}

		// Сохранение конфигурации через XHR GET
		function saveProject() {
			const progproj = document.getElementById('progproj').value;
			const progchip = document.getElementById('progchip').value;
			
			if (!progproj) {
				alert('Project name cannot be empty');
				return;
			}
			
			const xhr = new XMLHttpRequest();
			xhr.open('GET', '/project/save?progproj=' + encodeURIComponent(progproj) + '&progchip=' + encodeURIComponent(progchip), true);
			xhr.timeout = 5000;
			
			xhr.onload = function() {
				if (xhr.status === 200 && xhr.responseText === 'OK') {
					alert('Configuration saved successfully');
				} else {
					alert('Error: ' + xhr.responseText);
				}
			};
			xhr.onerror = function() {
				alert('Network error during save');
			};
			xhr.ontimeout = function() {
				alert('Save timeout');
			};
			xhr.send();
		}
	</script>

</body>

</html>
