<!DOCTYPE html>
<html>
<head>
    <title>Modules</title>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <markup>./page_head.html</markup>
    <h2 class="title" style="background: #7D8EE2"> <span id="devicename"></span> Modules</h2>

    <div class="content" style="text-align: center;">
        <table class="scan" style="width: auto; margin: 0 auto;">
            <tr>
                <th colspan="5">
                    Registered modules
                    <input type="button" value="Refresh" onclick="loadModules()">
                    <span id="catStatus" style="font-size:12px;"></span>
                </th>
            </tr>
            <tr><th>Namespace</th><th>Mode</th><th>Prio</th><th>Kind</th><th>Actions</th></tr>
            <tbody id="modBody"></tbody>
        </table>
    </div>

    <div class="footer">
        Core version: <span id="stateversion"> </span> &nbsp;|&nbsp;
        Build: <span id="stategentime"> </span> <br>
    </div>

    <markup>./page_bottom.html</markup>
    <script src="GetJson.js" defer></script>
    <script src="GetMarkup.js" defer></script>
    <script>
        const MODE_NAMES = ['off', 'auto', 'macro'];
        let MACROS_AVAILABLE = 1;

        function modeName(v) {
            return (v >= 0 && v < MODE_NAMES.length) ? MODE_NAMES[v] : '—';
        }

        async function loadModules() {
            const statusEl = document.getElementById('catStatus');
            statusEl.innerHTML = '...';
            try {
                const resp = await fetch('/state/modules', { cache: 'no-store' });
                const data = await resp.json();
                MACROS_AVAILABLE = (data.macros_available === 1) ? 1 : 0;

                const body = document.getElementById('modBody');
                body.innerHTML = '';
                const mods = data.modules || [];
                for (const m of mods) {
                    const tr = document.createElement('tr');

                    const tdNs = document.createElement('td');
                    tdNs.style.textAlign = 'left';
                    tdNs.innerText = m.ns;
                    tdNs.title = m.desc || '';
                    tr.appendChild(tdNs);

                    const tdMode = document.createElement('td');
                    if (m.has_mode !== 1) {
                        tdMode.innerText = '—';
                    } else if (m.privileged === 1) {
                        tdMode.innerText = modeName(m.mode);
                    } else {
                        const sel = document.createElement('select');
                        sel.id = 'mode_' + m.ns;
                        const maxMode = MACROS_AVAILABLE ? 2 : 1;
                        for (let i = 0; i <= maxMode; i++) {
                            const opt = document.createElement('option');
                            opt.value = i;
                            opt.text = MODE_NAMES[i];
                            sel.appendChild(opt);
                        }
                        sel.value = (m.mode >= 0) ? m.mode : 1;
                        tdMode.appendChild(sel);
                    }
                    tr.appendChild(tdMode);

                    const tdPrio = document.createElement('td');
                    tdPrio.innerText = (m.prio >= 0) ? m.prio : '—';
                    tr.appendChild(tdPrio);

                    const tdKind = document.createElement('td');
                    tdKind.innerText = (m.privileged === 1) ? 'core' : 'module';
                    tr.appendChild(tdKind);

                    const tdAct = document.createElement('td');
                    if (m.has_mode === 1 && m.privileged !== 1) {
                        const btn = document.createElement('input');
                        btn.type = 'button';
                        btn.value = 'Set';
                        btn.className = 'button-prog';
                        btn.onclick = () => setModuleMode(m.ns, document.getElementById('mode_' + m.ns).value);
                        tdAct.appendChild(btn);
                    }
                    tr.appendChild(tdAct);

                    body.appendChild(tr);
                }
                statusEl.innerHTML = mods.length + ' modules';
            } catch (e) {
                statusEl.innerHTML = 'Error';
            }
        }

        async function setModuleMode(ns, mode) {
            const statusEl = document.getElementById('catStatus');
            statusEl.innerHTML = '...';
            try {
                const resp = await fetch('/state/module_mode?ns=' + encodeURIComponent(ns) + '&mode=' + mode, { cache: 'no-store' });
                statusEl.innerHTML = (await resp.text()) + ' (' + ns + ')';
            } catch (e) {
                statusEl.innerHTML = 'Error';
            }
        }

        window.onload = function() {
            setTimeout(() => {
                ApplyCVT("/system/version").then(() => ApplyCVT("/state/ver"));
            }, 500);
            loadModules();
        };
    </script>
</body>
</html>
