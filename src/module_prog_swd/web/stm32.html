<!DOCTYPE html>
<html>
<head>
    <title>STM32 Programmer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-type" content="text/html; charset=utf-8">
    <link rel="stylesheet" href="style.css">
    <script src="FSBrowserNG.js"></script>
</head>
<body>
    <markup>./page_head.html</markup>
    <h2 class="title" style="background: #7D8EE2; padding: 8px;"> STM32 SWD Programmer</h2>
    <hr>

    <!-- Информация о диске -->
    <div id="diskinfo" style="text-align: center; margin: 10px 0;"></div>

    <!-- Форма загрузки файла прошивки -->
    <form id="uploadForm" enctype='multipart/form-data'>
        <table align = "center"> 
            <tr><th> <input id="fileName" type='file' name='update' style="display: block; margin: 20px auto; padding: 10px; font-size: 16px; width: auto; min-width: 300px;"> </th> </tr>
            <tr><td> 
                <input id="uploadButton" type='button' value='Upload firmware file' onclick="uploadFile()">
              </td> </tr>
        </table>
    </form>

    <hr>

    <!-- Таблица файлов прошивки -->
    <div style="overflow-x: auto;">
        <table id="filesTable" align="center" style="width: 100%; max-width: 1000px; border-collapse: collapse;">
            <thead>
                <tr style="background-color: #f2f2f2;">
                    <th style="padding: 8px; text-align: left; border-bottom: 2px solid #ddd;">Name</th>
                    <th style="padding: 8px; text-align: left; border-bottom: 2px solid #ddd;">Type</th>
                    <th style="padding: 8px; text-align: right; border-bottom: 2px solid #ddd;">Size</th>
                    <th style="padding: 8px; text-align: center; border-bottom: 2px solid #ddd;">Program date</th>
                    <th style="padding: 8px; text-align: center; border-bottom: 2px solid #ddd;">Actions</th>
                </tr>
            </thead>
            <tbody id="filesTableBody">
                <tr><td colspan="5" style="text-align: center; padding: 20px;">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <markup>./page_bottom.html</markup>
    <script src="GetMarkup.js" defer></script>
    <script src="GetJson.js" defer></script>
    <script src="microajax.js" defer></script>
    <script> 
        window.onload = function () {
            setTimeout(() => {
                loadDiskInfo();
                loadFilesList();
            }, 250);
        };

        // ========== Disk Info ==========
        function loadDiskInfo() {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', '/prog/diskinfo', true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    const fieldsRows = ParseCVT(xhr.response);
                    let all = "?", used = "?", free = "?";
                    for (let fields of fieldsRows) {
                        if (fields[0] === "diskall")   all = fields[1];
                        if (fields[0] === "diskused")  used = fields[1];
                        if (fields[0] === "diskfree")  free = fields[1];
                    }
                    document.getElementById('diskinfo').innerHTML =
                        "Disk: Total <b>" + all + "</b> bytes, Used <b>" + used + "</b> bytes, Free <b>" + free + "</b> bytes";
                }
            };
            xhr.send();
        }

        // ========== Files List ==========
        function loadFilesList() {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', '/prog/fileslist', true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    try {
                        const files = JSON.parse(xhr.response);
                        renderFilesTable(files);
                    } catch(e) {
                        document.getElementById('filesTableBody').innerHTML =
                            '<tr><td colspan="5" style="text-align: center; padding: 20px; color: red;">Error parsing file list</td></tr>';
                    }
                }
            };
            xhr.send();
        }

        function renderFilesTable(files) {
            const tbody = document.getElementById('filesTableBody');
            if (!files || files.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 20px;">No firmware files found</td></tr>';
                return;
            }

            let html = "";
            for (let i = 0; i < files.length; i++) {
                const f = files[i];
                const fname = f.filename || "";
                const ftype = f.filetype || "";
                const fsize = f.filesizestr || "";
                const progdate = f.progdate || "";
                const encodedName = encodeURIComponent(fname);

                html += "<tr>";
                html += "<td style='padding: 6px; border-bottom: 1px solid #ddd;'>" + escapeHtml(fname) + "</td>";
                html += "<td style='padding: 6px; border-bottom: 1px solid #ddd;'>" + escapeHtml(ftype) + "</td>";
                html += "<td style='padding: 6px; border-bottom: 1px solid #ddd; text-align: right;'>" + escapeHtml(fsize) + "</td>";
                html += "<td style='padding: 6px; border-bottom: 1px solid #ddd; text-align: center;'>" + escapeHtml(progdate) + "</td>";
                html += "<td style='padding: 6px; border-bottom: 1px solid #ddd; text-align: center; white-space: nowrap;'>";
                html += "<button onclick='deleteFile(\"" + encodedName + "\")' title='Delete file' style='margin: 0 4px; padding: 4px 8px; cursor: pointer; border: 1px solid #ccc; border-radius: 3px; background: #fff;'>🗑️</button>";
                html += "<button onclick='flashFile(\"" + encodedName + "\")' title='Program STM32' style='margin: 0 4px; padding: 4px 8px; cursor: pointer; border: 1px solid #ccc; border-radius: 3px; background: #fff;'>💾</button>";
                html += "</td>";
                html += "</tr>";
            }
            tbody.innerHTML = html;
        }

        function escapeHtml(text) {
            if (!text) return "";
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ========== Delete File ==========
        function deleteFile(filename) {
            const decodedName = decodeURIComponent(filename);
            if (!confirm('Delete file "' + decodedName + '"?')) return;
            
            const xhr = new XMLHttpRequest();
            xhr.open('GET', '/prog/delete?path=' + encodeURIComponent(decodedName), true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    loadFilesList();
                    loadDiskInfo();
                } else {
                    alert('Delete failed: ' + xhr.status);
                }
            };
            xhr.onerror = function() {
                alert('Network error during delete');
            };
            xhr.send();
        }

        // ========== Flash File (Program STM32) ==========
        function flashFile(filename) {
            if (!confirm('Program STM32 with "' + decodeURIComponent(filename) + '"?')) return;

            const xhr = new XMLHttpRequest();
            xhr.open('GET', '/prog/flash?path=' + encodeURIComponent(filename), true);
            
            xhr.onload = function() {
                setTimeout(() => {
                    loadFilesList();
                    loadDiskInfo();
                    alert('Programming completed successfully!');
                }, 2000);
            };
            
            xhr.onerror = function() {
                console.error('Network error during programming');
                alert('Network error during programming');
            };
            
            xhr.send();
        }

        // ========== Upload File ==========
        function uploadFile() {
            const fileInput = document.getElementById('fileName');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select a file first');
                return;
            }

            // Проверка длины имени файла (SPIFFS ограничение 32 байта)
            const MAX_FILENAME_LEN = 30;
            if (file.name.length > MAX_FILENAME_LEN) {
                alert('Filename too long! Maximum ' + MAX_FILENAME_LEN + ' characters allowed.\n' +
                      'Current filename length: ' + file.name.length + ' characters.\n\n' +
                      'Please rename the file and try again.');
                fileInput.value = "";
                return;
            }

            const formData = new FormData();
            formData.append('update', file);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/prog/uploadfile', true);
            
            // Запускаем polling ПОСЛЕ отправки запроса, чтобы сервер уже знал размер файла
            xhr.onloadstart = function() {
                startProgressPolling();
            };
            
            xhr.onload = function() {
                stopProgressPolling();
                
                if (xhr.status === 200) {
                    updateProgressDisplay(100);
                    setTimeout(() => {
                        hideProgressBarFinal();
                        loadFilesList();
                        loadDiskInfo();
                        fileInput.value = "";
                    }, 1500);
                } else {
                    hideProgressBarFinal();
                    alert('Upload failed with status: ' + xhr.status);
                }
            };
            
            xhr.onerror = function() {
                console.error('Network error during upload');
                stopProgressPolling();
                hideProgressBarFinal();
                alert('Network error during upload');
            };
            
            xhr.send(formData);
        }

        // ========== Progress Bar Polling ==========
        function hideProgressBar() {
            document.getElementById('progressContainer').style.display = 'none';
            updateProgressDisplay(0);
        }

        // Скрыть прогресс-бар без сброса в 0% (для финального показа 100%)
        function hideProgressBarFinal() {
            document.getElementById('progressContainer').style.display = 'none';
        }

        // --- Единый Progress Polling (/prog/progress) ---
        function stopProgressPolling() {
            if (progressTimer) {
                clearInterval(progressTimer);
                progressTimer = null;
            }
            isUploading = false;
        }

        function startProgressPolling() {
            document.getElementById('progressContainer').style.display = 'block';
            isUploading = true;
            
            if (progressTimer) {
                clearInterval(progressTimer);
                progressTimer = null;
            }
            
            progressTimer = setInterval(function() {
                if (!isUploading) {
                    stopProgressPolling();
                    return;
                }
                
                const xhr = new XMLHttpRequest();
                xhr.open('GET', '/prog/progress', true);
                
                xhr.onload = function() {
                    if (xhr.status === 200) {
                        const fieldsRows = ParseCVT(xhr.response);
                        for (let fields of fieldsRows) {
                            if (fields[0] === "percent") {
                                const percent = parseInt(fields[1]);
                                updateProgressDisplay(percent);
                                break;
                            }
                        }
                    }
                };
                
                xhr.onerror = function() { 
                    console.error('Error fetching progress');
                    stopProgressPolling();
                    hideProgressBar();
                };
                
                xhr.send();
            }, 1000);
        }

        function updateProgressDisplay(percent) {
            const progressText = document.getElementById('progressText');
            const progressBar = document.getElementById('progressBar');
            
            if (progressText) {
                progressText.innerHTML = 'Programming progress: ' + percent + '%';
            }
            if (progressBar) {
                progressBar.style.width = percent + '%';
                if (percent < 30) {
                    progressBar.style.backgroundColor = '#ff4444';
                } else if (percent < 70) {
                    progressBar.style.backgroundColor = '#ffaa00';
                } else {
                    progressBar.style.backgroundColor = '#4CAF50';
                }
            }
        }

        // ========== "Programming in progress..." message (for ESP8266) ==========
        function showProgWaitMessage() {
            const msg = document.getElementById('progWaitMessage');
            if (msg) msg.style.display = 'block';
        }

        function hideProgWaitMessage() {
            const msg = document.getElementById('progWaitMessage');
            if (msg) msg.style.display = 'none';
        }

    </script>
   
</body>
</html>
