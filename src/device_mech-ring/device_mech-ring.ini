	#------------------------- esp32 clock with ring -------------------------
[env:esp32_clock-mech_ring]
extends = env:esp32
src_filter = ${env:esp32.src_filter} +<module_udp/> +<module_otaclient/> +<module_i2c-mapper/> +<device_clock-mech/> +<module_ds3231/> +<device_mech-ring/> 
build_flags=
	${env.build_flags}
	${env:esp32.build_flags}
	-D MODULE_UDP=1
	-D MODULE_OTACLIENT=1
	-D DEBUG_OTACLIENT
	-D DEBUG_OTA
	-D DEBUG_LCD
	-D MODULE_I2C_MAPPER=1
	-D DEVICE_CLOCKMECH=1
	-D DEBUG_CLOCKMECH
	-D DEVICE_RINGMECH=1
	-D DEBUG_RINGMECH
	-D MODULE_DS3231=1
	-D DEBUG_DS3231=1
	-D DS3231_SQW_PIN=13
	-D DEBUGLOG_WIFI
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}

#------------------------- registry (автогенерация modules_registry) -------------------------
[registry]
object = device_mech_ring
define = DEVICE_RINGMECH
web = 1
loop = 0

