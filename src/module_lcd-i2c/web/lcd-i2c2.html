<!DOCTYPE html>
<html>
<head>
    <title>LCD I2C config</title>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <markup>./page_head.html</markup>
    <h2 class="title" style="background: #7D8EE2">
        <span id="devicename"></span> LCD I2C — Configuration
    </h2>

    <div class="content" style="text-align: center;">
        <form id="configForm">
            <table class="cfg">
                <tr><th colspan="2">LCD I2C Configuration</th></tr>
                <tr><td>I2C Address (hex):</td><td><input type="text" id="i2cAddr" name="i2cAddr" value=""></td></tr>
                <tr><td>Columns:</td><td><input type="number" id="cols" name="cols" value="" min="1" max="40"></td></tr>
                <tr><td>Rows:</td><td><input type="number" id="rows" name="rows" value="" min="1" max="4"></td></tr>
                <tr><td>Backlight:</td><td><input type="checkbox" id="backlight" name="backlight" value="true"></td></tr>
                <tr><td colspan="2" style="text-align: center;">
                    <button type="submit">Save & Apply</button>
                </td></tr>
            </table>
        </form>
        <div id="msg" style="margin-top: 8px;"></div>
    </div>

    <markup>./page_bottom.html</markup>

    <script src="GetJson.js" defer></script>
    <script src="GetMarkup.js" defer></script>
    <script>
        window.onload = function() {
            ApplyCVT("/system/devconf")
            .then(() => ApplyCVT("/system/version"))
            .then(() => {
                fetch('/lcd-i2c/info')
                .then(r => r.text())
                .then(applyCvtData)
                .catch(e => console.error('loadInfo error:', e));

                document.getElementById('configForm').addEventListener('submit', function(e) {
                    e.preventDefault();
                    var data = new URLSearchParams(new FormData(this));
                    if (!data.has('backlight')) data.append('backlight', 'false');
                    fetch('/lcd-i2c/save_config', { method: 'POST', body: data })
                    .then(r => r.text())
                    .then(function(text) {
                        var msg = document.getElementById('msg');
                        msg.innerHTML = text === 'OK'
                            ? '<span style="color:green">Configuration applied</span>'
                            : '<span style="color:red">Error: ' + text + '</span>';
                    })
                    .catch(function(e) {
                        document.getElementById('msg').innerHTML = '<span style="color:red">Error: ' + e + '</span>';
                    });
                });
            });
        };

        function applyCvtData(data) {
            var lines = data.split('\n');
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();
                if (!line) continue;
                var parts = line.split('|');
                var id = parts[0];
                var val = parts[1];
                var type = parts[2];
                var el = document.getElementById(id);
                if (!el) continue;
                if (type === 'chk') el.checked = (val === 'checked');
                else if (type === 'input') el.value = val;
                else if (type === 'div') el.innerHTML = val;
            }
        }
    </script>
</body>
</html>
