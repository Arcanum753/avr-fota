<!DOCTYPE html>
<html>

<head>
    <title>Time Sources</title>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <markup>./page_head.html</markup>
    <h2 class="title" style="background: #7D8EE2"> <span id="devicename"></span> Time Sources</h2>

    <div class="content" style="text-align: center;">
        <form id="timeForm" onsubmit="return false;">
            <table class="scan" style="width: auto; margin: 0 auto;">
                <tr><th colspan="2">Time settings</th></tr>
                <tr>
                    <td class="label">Timezone</td>
                    <td>
                        <select id="time_tz" name="tz" style="width:200px;">
                            <option value="-120">(GMT-12:00)</option>
                            <option value="-110">(GMT-11:00)</option>
                            <option value="-100">(GMT-10:00)</option>
                            <option value="-90">(GMT-09:00)</option>
                            <option value="-80">(GMT-08:00)</option>
                            <option value="-70">(GMT-07:00)</option>
                            <option value="-60">(GMT-06:00)</option>
                            <option value="-50">(GMT-05:00)</option>
                            <option value="-40">(GMT-04:00)</option>
                            <option value="-35">(GMT-03:30)</option>
                            <option value="-30">(GMT-03:00)</option>
                            <option value="-20">(GMT-02:00)</option>
                            <option value="-10">(GMT-01:00)</option>
                            <option value="0">(GMT+00:00)</option>
                            <option value="10">(GMT+01:00)</option>
                            <option value="20">(GMT+02:00)</option>
                            <option value="30">(GMT+03:00)</option>
                            <option value="35">(GMT+03:30)</option>
                            <option value="40">(GMT+04:00)</option>
                            <option value="45">(GMT+04:30)</option>
                            <option value="50">(GMT+05:00)</option>
                            <option value="55">(GMT+05:30)</option>
                            <option value="57">(GMT+05:45)</option>
                            <option value="60">(GMT+06:00)</option>
                            <option value="65">(GMT+06:30)</option>
                            <option value="70">(GMT+07:00)</option>
                            <option value="80">(GMT+08:00)</option>
                            <option value="90">(GMT+09:00)</option>
                            <option value="95">(GMT+09:30)</option>
                            <option value="100">(GMT+10:00)</option>
                            <option value="110">(GMT+11:00)</option>
                            <option value="120">(GMT+12:00)</option>
                            <option value="130">(GMT+13:00)</option>
                        </select>
                    </td>
                </tr>
                <tr><td class="label">Daylight saving:</td> <td> <input type="checkbox" id="time_dst" name="dst"></td></tr>
                <tr><td class="label">Sync RTC every (s):</td> <td> <input type="number" id="time_sync_interval" name="syncIntervalS" min="0" max="86400"></td></tr>
            </table>

            <table class="scan" style="width: auto; margin: 12px auto;">
                <tr>
                    <th colspan="6">
                        Sources
                        <input type="button" value="Refresh" onclick="loadSources()">
                        <span id="srcStatus" style="font-size:12px;"></span>
                    </th>
                </tr>
                <tr><th>Name</th><th>Enabled</th><th>Priority</th><th>Valid</th><th>Status</th><th>Actions</th></tr>
                <tbody id="srcBody"></tbody>
            </table>

            <table class="scan" style="width: auto; margin: 0 auto;">
                <tr><th colspan="2">Current time</th></tr>
                <tr><td class="label">Now:</td> <td><span id="time_now_str">—</span> (<span id="time_now">0</span>)</td></tr>
                <tr><td class="label">Valid:</td> <td><span id="time_valid_str">—</span></td></tr>
                <tr><td class="label">Active source:</td> <td><span id="time_source">—</span></td></tr>
                <tr><td class="label">Sources:</td> <td><span id="time_sources">—</span></td></tr>
            </table>

            <table class="scan" style="width: auto; margin: 12px auto;">
                <tr><th colspan="2">Set time</th></tr>
                <tr><td class="label">Epoch:</td> <td><input type="text" id="setEpoch" name="value" style="width:200px;"></td></tr>
                <tr><td colspan="2" style="text-align: center; padding: 8px;">
                    <button type="button" class="button-prog" onclick="saveSettings()">Save</button>
                    <button type="button" class="button-prog" onclick="setTime()">Set time</button>
                </td></tr>
            </table>
        </form>
    </div>

    <div class="footer">
        Time version: <span id="timeversion"> </span> &nbsp;|&nbsp;
        Build: <span id="timegentime"> </span> <br>
    </div>

    <markup>./page_bottom.html</markup>
    <script src="GetJson.js" defer></script>
    <script src="GetMarkup.js" defer></script>
    <script>
        function loadSources() {
            const statusEl = document.getElementById('srcStatus');
            statusEl.innerHTML = '...';
            fetch('/time/sources', { cache: 'no-store' })
                .then((r) => r.json())
                .then((data) => {
                    const body = document.getElementById('srcBody');
                    body.innerHTML = '';
                    for (const s of data) {
                        const tr = document.createElement('tr');

                        const tdName = document.createElement('td');
                        tdName.innerText = s.name;
                        tr.appendChild(tdName);

                        const tdEn = document.createElement('td');
                        const cb = document.createElement('input');
                        cb.type = 'checkbox';
                        cb.id = 'src_en_' + s.name;
                        cb.checked = !!s.enabled;
                        tdEn.appendChild(cb);
                        tr.appendChild(tdEn);

                        const tdPrio = document.createElement('td');
                        const pi = document.createElement('input');
                        pi.type = 'number';
                        pi.min = '0';
                        pi.max = '1000';
                        pi.id = 'src_prio_' + s.name;
                        pi.value = s.prio;
                        pi.style.width = '70px';
                        tdPrio.appendChild(pi);
                        tr.appendChild(tdPrio);

                        const tdValid = document.createElement('td');
                        tdValid.innerText = s.valid ? 'valid' : 'invalid';
                        tdValid.style.color = s.valid ? 'green' : 'red';
                        tr.appendChild(tdValid);

                        const tdStatus = document.createElement('td');
                        tdStatus.innerText = s.status ? s.status : (s.valid ? 'ok' : '—');
                        tr.appendChild(tdStatus);

                        const tdAct = document.createElement('td');
                        const btn = document.createElement('input');
                        btn.type = 'button';
                        btn.value = 'Sync now';
                        btn.className = 'button-prog';
                        btn.onclick = () => syncSource(s.name);
                        tdAct.appendChild(btn);
                        tr.appendChild(tdAct);

                        body.appendChild(tr);
                    }
                    statusEl.innerHTML = data.length + ' sources';
                })
                .catch(() => { statusEl.innerHTML = 'Error'; });
        }

        function saveSettings() {
            const fd = new FormData();
            fd.append('tz', document.getElementById('time_tz').value);
            if (document.getElementById('time_dst').checked) { fd.append('dst', 'true'); }
            fd.append('syncIntervalS', document.getElementById('time_sync_interval').value || '0');
            fetch('/time/sources', { cache: 'no-store' })
                .then((r) => r.json())
                .then((data) => {
                    for (const s of data) {
                        const en = document.getElementById('src_en_' + s.name);
                        const pr = document.getElementById('src_prio_' + s.name);
                        if (pr) { fd.append(s.name + '_prio', pr.value); }
                        fd.append(s.name + '_enabled', (en && en.checked) ? 'true' : 'false');
                    }
                    return fetch('/time/save', { method: 'POST', body: fd });
                })
                .then((r) => r.text())
                .then((t) => { document.getElementById('srcStatus').innerHTML = t; loadSources(); })
                .catch(() => { document.getElementById('srcStatus').innerHTML = 'Error'; });
        }

        function syncSource(name) {
            const fd = new FormData();
            fd.append('source', name);
            fetch('/time/sync', { method: 'POST', body: fd })
                .then((r) => r.text())
                .then((t) => {
                    document.getElementById('srcStatus').innerHTML = t + ' (' + name + ')';
                    loadSources();
                    refreshInfo();
                });
        }

        function setTime() {
            const fd = new FormData();
            fd.append('value', document.getElementById('setEpoch').value);
            fetch('/time/set', { method: 'POST', body: fd })
                .then((r) => r.text())
                .then((t) => { document.getElementById('srcStatus').innerHTML = t; refreshInfo(); });
        }

        function refreshInfo() {
            ApplyCVT('/time/info');
        }

        window.onload = function() {
            setTimeout(() => {
                ApplyCVT('/system/version');
                ApplyCVT('/time/ver');
                refreshInfo();
            }, 100);
            loadSources();
            setInterval(refreshInfo, 5000);
        };
    </script>
</body>

</html>
