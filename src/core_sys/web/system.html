<!DOCTYPE html>
<html>

<head>
    <title>FSBrowserNG System Settings</title>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<link rel="stylesheet" href="style.css">
</head>

<body>
    <markup>./page_head.html</markup>
    <h2 class="title" style="background: #7D8EE2">System configuration</h2>
    <div class="content">
    <form action="" method="get">
        <table class="scan">
            <thead><tr><th colspan="2">Device Settings</th></tr></thead>
            <tr><td class="label">Name of device</td>       <td><input type="text" id="name"   name="name" value=""></td></tr>
            <tr><td class="label">Device serial number</td> <td><input type="text" id="serial" name="serial" value=""></td></tr>
            <tr><td colspan="2" align="center"> <input type="submit" value="Save" class="button-prog"></td></tr>
        </table>
    </form>
    </div>
<hr>
    <div class="content">
    <form>
        <table class="scan">
            <thead><tr><th colspan="2">Device Control</th></tr></thead>
            <tr><td colspan="2" align="center"><input type="button" value="Reset chip" class="button-del" onclick='javascript:restartESP()'></td></tr>
        </table>
    </form>
    </div>
<hr>
    <div class="content">
    <form id="wwwAuthForm" onsubmit=" return checkAuth( this ) " method="get">
        <input type="hidden" id="authconf" name="authconf" value="">
        <table class="scan">
            <thead><tr><th colspan="2">Web Authentication</th></tr></thead>
            <tr><td class="label"><label for="wwwauth">Use auth:</label></td><td><input type="checkbox" id="wwwauth" name="wwwauth" onclick='javascript:enableAuthFields(this);'></td></tr>
            <tr id="username" style="display: none;"><td class="label"><label for="wwwuser">Web User:</label></td><td><input type="text" id="wwwuser" name="wwwuser" value=""></td></tr>
            <tr id="password" style="display: none;"><td class="label"><label for="wwwpass">Password:</label></td><td><input type="password" id="wwwpass" name="wwwpass" value=""></td></tr>
            <tr><td align="center" colspan="2">Notice password is used for<br/>HTTP Auth, AP Mode and OTA</td></tr>
            <tr><td align="center"><input type="submit" value="Save" class="button-prog"></td></tr>
            <tr><td id="submitResult" align="center"></td></tr>
        </table>
    </form>
    </div>
    <hr>

    <markup>./page_bottom.html</markup>
    <script src="GetJson.js" defer></script>
    <script src="GetMarkup.js" defer></script>
    <script>
            window.onload = function() {
                ApplyCVT("/system/devconf")
                    .then(() => ApplyCVT("/system/version"))
                    .then(() => ApplyCVT("/system/wwwauth"))
                    .then(() => enableAuthFields(document.getElementById("wwwauth")));
            };

        function enableAuthFields(cb) {
            let username_row = document.getElementById('username').style;
            let password_row = document.getElementById('password').style;
            if (cb.checked)
            {
                username_row.display = 'table-row';
                password_row.display = 'table-row';
            }
            else
            {
                username_row.display = 'none';
                password_row.display = 'none';
            }
        }
        
        function checkAuth(frm)
        {
            if (document.getElementById("wwwauth").checked)
            {
                if((document.getElementById("wwwuser").value == "") || (document.getElementById("wwwpass").value == ""))
                {
                    document.getElementById("submitResult").innerHTML = "User and password must be filled";
                    return false;
                }
            }
            else
            {
                document.getElementById("wwwuser").value = "";
                document.getElementById("wwwpass").value = "";
            }
            document.getElementById("wwwAuthForm").action = "/system/savewwwauth";
        }

        function restartESP() {
            fetch("/system/restart").catch(function() {});
        }

        function GetState() {
            ApplyCVT("/system/wwwauth");
        }
        
        // УНИВЕРСАЛЬНАЯ ФУНКЦИЯ - работает только с вызвавшим её input
        function setMinMax(inputElement) {
            // Проверяем, что элемент существует
            if (inputElement && inputElement.value != "") {
                let val = parseInt(inputElement.value);
                let min = parseInt(inputElement.min);
                let max = parseInt(inputElement.max);
                
                // Проверяем, что min и max - числа
                if (!isNaN(min) && val < min) {
                    inputElement.value = min;
                }
                if (!isNaN(max) && val > max) {
                    inputElement.value = max;
                }
            }
        };
        
        // ОБРАТНАЯ СВЯЗЬ ПРИ СОХРАНЕНИИ
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const statusDiv = document.createElement('div');
            statusDiv.id = 'saveStatus';
            statusDiv.style.textAlign = 'center';
            statusDiv.style.marginTop = '10px';
            statusDiv.style.padding = '5px';
            statusDiv.style.borderRadius = '3px';
            
            const oldStatus = document.getElementById('saveStatus');
            if (oldStatus) oldStatus.remove();
            
            this.appendChild(statusDiv);
            statusDiv.innerHTML = '⏳ Сохранение...';
            statusDiv.style.backgroundColor = '#fff3cd';
            statusDiv.style.color = '#856404';
            
            fetch('/system.html?' + new URLSearchParams(formData), {
                method: 'GET'
            })
            .then(response => {
                if (response.ok) {
                    statusDiv.innerHTML = ' Настройки сохранены!';
                    statusDiv.style.backgroundColor = '#d4edda';
                    statusDiv.style.color = '#155724';
                    
                    // Обновляем данные с сервера через 1 секунду
                    setTimeout(() => {
                        ApplyCVT("/system/devconf");
                        // Убираем сообщение через 3 секунды
                        setTimeout(() => {
                            statusDiv.style.opacity = '0';
                            setTimeout(() => statusDiv.remove(), 500);
                        }, 3000);
                    }, 1000);
                } else {
                    statusDiv.innerHTML = ' Ошибка сохранения';
                    statusDiv.style.backgroundColor = '#f8d7da';
                    statusDiv.style.color = '#721c24';
                }
            })
            .catch(error => {
                statusDiv.innerHTML = ' Ошибка соединения';
                statusDiv.style.backgroundColor = '#f8d7da';
                statusDiv.style.color = '#721c24';
            });
        });
       
    </script>
</body>

</html>
