#------------------------- esp32 + ds3231 -------------------------
[env:esp32-ds3231]
extends = env:esp32
src_filter = ${platformio.src_filter} +<module_ds3231/> +<module_udp/>
build_flags=
	${env.build_flags}
	${env:esp32.build_flags}
	-D MODULE_UDP=1
	-D MODULE_DS3231=1
	-D DEBUG_DS3231=1
	-D DS3231_SQW_PIN=13
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}

#------------------------- esp8266 + ds3231 -------------------------
[env:esp8266-ds3231]
extends = env:esp8266
src_filter = ${platformio.src_filter} +<module_ds3231/> +<module_udp/>
build_flags=
	${env.build_flags}
	${env:esp8266.build_flags}
	-D MODULE_UDP=1
	-D MODULE_DS3231=1
	-D DEBUG_DS3231=1
lib_deps =
	${env.lib_deps}
	${env:esp8266.lib_deps}

#------------------------- registry (автогенерация modules_registry) -------------------------
[registry]
object = ModClassDs3231
define = MODULE_DS3231
web = 1
loop = 0
