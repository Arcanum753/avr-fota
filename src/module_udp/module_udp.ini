#------------------------- esp32 + udp -------------------------
[env:esp32-udp]
extends = env:esp32
src_filter = ${platformio.src_filter} +<module_udp/>
build_flags=
	${env.build_flags}
	${env:esp32.build_flags}
	-D MODULE_UDP=1
	-D DEBUG_UDP
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}

#------------------------- esp8266 + udp -------------------------
[env:esp8266-udp]
extends = env:esp8266
src_filter = ${platformio.src_filter} +<module_udp/>
build_flags=
	${env.build_flags}
	${env:esp8266.build_flags}
	-D MODULE_UDP=1
	-D DEBUG_UDP
lib_deps =
	${env.lib_deps}
	${env:esp8266.lib_deps}

#------------------------- registry (автогенерация modules_registry) -------------------------
[registry]
object = module_udp
define = MODULE_UDP
web = 1
loop = 0
