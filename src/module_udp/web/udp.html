<!DOCTYPE html>
<html>

<head>
    <title>UDP Settings</title>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<link rel="stylesheet" href="style.css">
</head>

<body>
    <markup>./page_head.html</markup>
    <h2 class="title" style="background: #7D8EE2"> <span id="devicename"></span> UDP Configuration</h2>
    
    <div class="content" style="text-align: center;">
        <form action="" method="post">
            <table class="scan" style="width: auto; margin: 0 auto;">
                <tr><th colspan="2">UDP Settings</th></tr>
                <tr><td class="label">Udp TX port</td>    <td><input type="text" id="udpporttx"    name="udpporttx" value=""></td></tr>
                <tr><td class="label">Udp RX port</td>    <td><input type="text" id="udpportrx"    name="udpportrx" value=""></td></tr>
                <tr><td class="label">Udp key word</td>   <td><input type="text" id="udpkeyword"    name="udpkeyword" value=""></td></tr>
                <tr><td class="label">Udp broadcast every ... minute (0 is off)</td>    <td><input type="number" id="udptime" name="udptime"  min="0" max="60" value=""  onkeyup=setMinMax();></td></tr>
                <tr><td class="label">Udp broadcast on WiFi connect:</td> <td> <input type="checkbox" id="udppoweron" name="udppoweron"></td>  </tr>
                <tr><td class="label">Udp response on UDP broadcast witn keyword:</td> <td> <input type="checkbox" id="udpresponse" name="udpresponse"></td>  </tr>
                <tr><td colspan="2" style="text-align: center; padding: 8px;"> <input type="submit" value="Save" class="button-prog"></td></tr>
            </table>
        </form>
    </div>

    <div class="content" style="text-align: center;">
        <form id="upload" onsubmit="event.preventDefault(); udpTxTest()" enctype="multipart/form-data" autocomplete="off">
            <table class="scan" style="width: auto; margin: 0 auto;">
                <tr><th colspan="2">UDP Test</th></tr>
                <tr> <td style="text-align: center; padding: 8px;"> <span title="Test UDP broadcast message.">
                        <input id="broadcastTest" type='submit' value='Test UDP broadcast' class="button-prog">
                    </span> </td></tr>
            </table>
        </form>
    </div>

    <div class="footer">
        Module version: <span id="udpversion"> </span> &nbsp;|&nbsp;
        Build: <span id="udpgentime"> </span> <br>
    </div>

	<markup>./page_bottom.html</markup>
	<script src="GetJson.js" defer></script>
	<script src="GetMarkup.js" defer></script>
	<script>
		window.onload = function() {
			setTimeout(() => {
				ApplyCVT("/system/version")
					.then(() => ApplyCVT("/udp/info"))
					.then(() => ApplyCVT("/udp/ver"));
			}, 500);
			
		};

		function udpTxTest(){
            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/udp/test');
            xhr.send();
            console.log("udpTxTest();");
        }
		function setMinMax() {
            const el = document.getElementById("udptime");
            if (el.value != "") {
                if (parseInt(el.value) < parseInt(el.min)) {
                    el.value = el.min;
                }
                if (parseInt(el.value) > parseInt(el.max)) {
                    el.value = el.max;
                }
            }
        };
		</script>
</body>

</html>
