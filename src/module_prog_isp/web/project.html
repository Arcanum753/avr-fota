<!DOCTYPE html>
<html>
<head>
    <title>Programmer project configuration</title>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<link rel="stylesheet" href="style.css">
</head>

<body>
    <markup>./page_head.html</markup>
    <h2 class="title" style="background: #7D8EE2">Programmer project configuration</h2>

    <form action="" method="post">
        <table border="0" cellspacing="0" cellpadding="3" align="center">
            <tr><td align="left">Programmator project name:</td>    <td><input type="text" id="progproj"   name="progproj" value=""></td></tr>
            <tr><td align="left">Programmator chip mem size:</td>   <td><input type="text" id="progmem"    name="progmem" value=""></td></tr>
            <tr><td colspan="2" align="center"> <input type="submit" value="Save"></td></tr>
        </table>
    </form>    
    
	<markup>./page_bottom.html</markup>
	<script src="GetJson.js" defer></script>
	<script src="GetMarkup.js" defer></script>
	<script>
		window.onload = function() {
			setTimeout(() => {
				ApplyCVT("/system/version")
					.then(() => ApplyCVT("/project/info"));
			}, 500);
		};


        function setMinMax() {
            const el = document.getElementById("udptime");
            if (el.value != "") {
                if (parseInt(el.value) < parseInt(el.min)) {
                    el.value = el.min;
                }
                if (parseInt(el.value) > parseInt(el.max)) {
                    el.value = el.max;
                }
            }
        }
	</script>

</body>

</html>
