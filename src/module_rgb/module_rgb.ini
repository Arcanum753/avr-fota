#------------------------- esp32 + rgb -------------------------
[env:esp32-rgb]
extends = env:esp32
src_filter = ${platformio.src_filter} +<module_rgb/> +<module_udp/>
build_flags=
	${env.build_flags}
	${env:esp32.build_flags}
	-D MODULE_UDP=1
	-D MODULE_RGB=1
	-D DEBUG_RGB=1
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}

#------------------------- esp8266 + rgb -------------------------
[env:esp8266-rgb]
extends = env:esp8266
src_filter = ${platformio.src_filter} +<module_rgb/> +<module_udp/>
build_flags=
	${env.build_flags}
	${env:esp8266.build_flags}
	-D MODULE_UDP=1
	-D MODULE_RGB=1
	-D DEBUG_RGB=1
lib_deps =
	${env.lib_deps}
	${env:esp8266.lib_deps}

#------------------------- registry (автогенерация modules_registry) -------------------------
[registry]
object = module_rgb
define = MODULE_RGB
web = 1
loop = 0
