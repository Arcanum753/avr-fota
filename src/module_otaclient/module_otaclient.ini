#------------------------- esp32 + otaclient -------------------------
[env:esp32-otaclient]
extends = env:esp32
src_filter = ${platformio.src_filter} +<module_udp/> +<module_otaclient/>
build_flags=
	${env.build_flags}
	${env:esp32.build_flags}
	-D MODULE_UDP=1
	-D DEBUG_UDP
	-D MODULE_OTACLIENT=1
	-D DEBUG_OTACLIENT
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}

#------------------------- esp8266 + otaclient -------------------------
[env:esp8266-otaclient]
extends = env:esp8266
src_filter = ${platformio.src_filter} +<module_udp/> +<module_otaclient/>
build_flags=
	${env.build_flags}
	${env:esp8266.build_flags}
	-D MODULE_UDP=1
	-D DEBUG_UDP
	-D MODULE_OTACLIENT=1
	-D DEBUG_OTACLIENT
lib_deps =
	${env.lib_deps}
	${env:esp8266.lib_deps}

#------------------------- registry (автогенерация modules_registry) -------------------------
# ВНИМАНИЕ: module_otaclient обрабатывается особым образом — его begin/web_Init/loop жёстко
# прописаны в python/module_registry_gen.py в core-группах (рядом с базовым OTA),
# а НЕ через флаги web/loop. Поэтому здесь указываются только object и define.
[registry]
object = module_otaclient
define = MODULE_OTACLIENT
