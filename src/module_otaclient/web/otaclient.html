<!DOCTYPE html>
<html>

<head>
    <title>OTA Client Settings</title>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<link rel="stylesheet" href="style.css">
</head>

<body>
    <markup>./page_head.html</markup>
    <h2 class="title" style="background: #7D8EE2"> <span id="devicename"></span> OTA Client Configuration</h2>
    
    <div class="content" style="text-align: center;">
        <form id="configForm" onsubmit="return saveOtaConfig(event)">
            <table class="scan" style="width: auto; margin: 0 auto;">
                <tr><th colspan="2">OTA Client Settings</th></tr>
                <tr><td class="label">OTA Client check every ... minute (0 is off)</td>    <td><input type="number" id="otaclienttime" name="otaclienttime"  min="0" max="60" value=""  onkeyup=setMinMax();></td></tr>
                <tr><td class="label">OTA Client update on WiFi connect:</td> <td> <input type="checkbox" id="otaclientpoweron" name="otaclientpoweron"></td>  </tr>
                <tr><td class="label">OTA Server Address:</td> <td> <input type="text" id="otaclientaddr" name="otaclientaddr" maxlength="172" value=""></td> </tr>
                <tr><td class="label">OTA Server Port:</td> <td> <input type="number" id="otaclientport" name="otaclientport" min="1" max="65535" value=""></td> </tr>
                <tr><td class="label">OTA Manifest Path:</td> <td> <input type="text" id="otaclientmanifest" name="otaclientmanifest" maxlength="172" value=""></td> </tr>
                <tr><td colspan="2" style="text-align: center; padding: 8px;"> <input type="submit" value="Save" class="button-prog"></td></tr>
            </table>
        </form>
    </div>

    <div class="content" style="text-align: center;">
        <form id="upload" onsubmit="event.preventDefault(); otaClientTest()" enctype="multipart/form-data" autocomplete="off">
            <table class="scan" style="width: auto; margin: 0 auto;">
                <tr><th colspan="2">OTA Test</th></tr>
                <tr> <td style="text-align: center; padding: 8px;"> <span title="Test OTA Client check.">
                        <input id="broadcastTest" type='submit' value='Test OTA Client' class="button-prog">
                    </span> </td></tr>
            </table>
        </form>
    </div>

    <!-- Test Result Display -->
    <div id="testResult" style="display:none; text-align:center; margin:10px auto; max-width:500px; padding:10px; border-radius:8px; font-weight:bold;">
    </div>
    <div id="updateButtonDiv" style="display:none; text-align:center; margin:10px auto;">
        <button onclick="otaClientUpdate()" class="button-prog" style="padding:10px 30px; font-size:16px;">Update Now</button>
    </div>

    <div class="footer">
        Module version: <span id="otaclientversion"> </span> &nbsp;|&nbsp;
        Build: <span id="otaclientgentime"> </span> <br>
    </div>

	<markup>./page_bottom.html</markup>
	<script src="GetJson.js" defer></script>
	<script src="GetMarkup.js" defer></script>
	<script>
		// Флаг для блокировки множественных одновременных тестов
		let _otaTestInProgress = false;

		window.onload = function() {
			setTimeout(() => {
				ApplyCVT("/system/version");
	               ApplyCVT("/otaclient/info");
	               ApplyCVT("/otaclient/ver");
			}, 100);
			
		};

		function otaClientTest(){
	           // Защита от повторных кликов пока тест выполняется
	           if (_otaTestInProgress) {
	               console.log("Test already in progress, ignoring click");
	               return;
	           }
	           _otaTestInProgress = true;
	           
	           // Блокируем кнопку
	           const testBtn = document.getElementById('broadcastTest');
	           if (testBtn) testBtn.disabled = true;
	           
	           const xhr = new XMLHttpRequest();
	           xhr.open('POST', '/otaclient/test');
	           xhr.send();
	           console.log("otaClientTest();");
	           
	           // Show "checking" message
	           const resultDiv = document.getElementById('testResult');
	           resultDiv.style.display = 'block';
	           resultDiv.style.background = '#FFF3CD';
	           resultDiv.style.color = '#856404';
	           resultDiv.style.border = '1px solid #FFEAA7';
	           resultDiv.innerHTML = 'Checking...';
	           document.getElementById('updateButtonDiv').style.display = 'none';
	           
	           // Poll for status
	           setTimeout(pollTestStatus, 500);
	       }
	       
	       function _otaTestComplete() {
	           // Разблокировка после завершения теста (успех или ошибка)
	           _otaTestInProgress = false;
	           const testBtn = document.getElementById('broadcastTest');
	           if (testBtn) testBtn.disabled = false;
	       }
	       
	       function pollTestStatus() {
	           const xhr = new XMLHttpRequest();
	           xhr.open('GET', '/otaclient/teststatus');
	           xhr.timeout = 5000; // 5 second XHR timeout
	           
	           xhr.onload = function() {
	               if (xhr.status === 200) {
	                   try {
	                       const data = JSON.parse(xhr.responseText);
	                       const resultDiv = document.getElementById('testResult');
	                       const updateDiv = document.getElementById('updateButtonDiv');
	                       
	                       resultDiv.style.display = 'block';
	                       
	                       if (data.code === 1) {
	                           // Pending - poll again
	                           setTimeout(pollTestStatus, 500);
	                           return;
	                       }
	                       
	                       // Тест завершён (code !== 1) - разблокируем
	                       _otaTestComplete();
	                       
	                       if (data.code === 2) {
	                           // Server unavailable
	                           resultDiv.style.background = '#F8D7DA';
	                           resultDiv.style.color = '#721C24';
	                           resultDiv.style.border = '1px solid #F5C6CB';
	                           resultDiv.innerHTML = '❌ ' + data.message;
	                           updateDiv.style.display = 'none';
	                       } else if (data.code === 3) {
	                           // No updates - color depends on compare result
	                           // compare: 1=newer, 0=same, -1=older, -2=missing
	                           if (data.compare === 0) {
	                               // Version is current (same) -> YELLOW
	                               resultDiv.style.background = '#FFF3CD';
	                               resultDiv.style.color = '#856404';
	                               resultDiv.style.border = '1px solid #FFEAA7';
	                               resultDiv.innerHTML = '⚠️ ' + data.message;
	                           } else if (data.compare === -1) {
	                               // Server version is older -> RED
	                               resultDiv.style.background = '#F8D7DA';
	                               resultDiv.style.color = '#721C24';
	                               resultDiv.style.border = '1px solid #F5C6CB';
	                               resultDiv.innerHTML = '🔴 ' + data.message;
	                           } else {
	                               // No version info or missing -> YELLOW
	                               resultDiv.style.background = '#FFF3CD';
	                               resultDiv.style.color = '#856404';
	                               resultDiv.style.border = '1px solid #FFEAA7';
	                               resultDiv.innerHTML = '⚠️ ' + data.message;
	                           }
	                           updateDiv.style.display = 'none';
	                       } else if (data.code === 4) {
	                           // Update available -> GREEN (newer version)
	                           resultDiv.style.background = '#D4EDDA';
	                           resultDiv.style.color = '#155724';
	                           resultDiv.style.border = '1px solid #C3E6CB';
	                           resultDiv.innerHTML = '✅ ' + data.message;
	                           updateDiv.style.display = 'block';
	                       } else if (data.code === 5) {
	                           // Updating
	                           resultDiv.style.background = '#D4EDDA';
	                           resultDiv.style.color = '#155724';
	                           resultDiv.style.border = '1px solid #C3E6CB';
	                           resultDiv.innerHTML = '⏳ Updating... Please wait. Device will restart.';
	                           updateDiv.style.display = 'none';
	                       } else {
	                           resultDiv.style.display = 'none';
	                           updateDiv.style.display = 'none';
	                           _otaTestComplete();
	                       }
	                   } catch(e) {
	                       console.log("Parse error:", e);
	                       _otaTestComplete();
	                   }
	               } else {
	                   // HTTP status !== 200
	                   _otaTestComplete();
	               }
	           };
	           
	           xhr.onerror = function() {
	               // Сетевая ошибка - ESP не отвечает
	               console.log("pollTestStatus: network error");
	               _otaTestComplete();
	               const resultDiv = document.getElementById('testResult');
	               resultDiv.style.display = 'block';
	               resultDiv.style.background = '#F8D7DA';
	               resultDiv.style.color = '#721C24';
	               resultDiv.style.border = '1px solid #F5C6CB';
	               resultDiv.innerHTML = '❌ Connection error - server may be unavailable';
	               document.getElementById('updateButtonDiv').style.display = 'none';
	           };
	           
	           xhr.ontimeout = function() {
	               // XHR timeout (5s) - ESP не отвечает
	               console.log("pollTestStatus: timeout");
	               _otaTestComplete();
	               const resultDiv = document.getElementById('testResult');
	               resultDiv.style.display = 'block';
	               resultDiv.style.background = '#F8D7DA';
	               resultDiv.style.color = '#721C24';
	               resultDiv.style.border = '1px solid #F5C6CB';
	               resultDiv.innerHTML = '❌ Test timed out - server may be unavailable';
	               document.getElementById('updateButtonDiv').style.display = 'none';
	           };
	           
	           xhr.send();
	       }
        
        function otaClientUpdate() {
            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/otaclient/update');
            xhr.onload = function() {
                const resultDiv = document.getElementById('testResult');
                resultDiv.style.display = 'block';
                resultDiv.style.background = '#D4EDDA';
                resultDiv.style.color = '#155724';
                resultDiv.style.border = '1px solid #C3E6CB';
                resultDiv.innerHTML = '⏳ Update started... Device will restart.';
                document.getElementById('updateButtonDiv').style.display = 'none';
                
                // Poll for status change
                setTimeout(pollTestStatus, 1000);
            };
            xhr.send();
        }

        function saveOtaConfig(event) {
            event.preventDefault();
            const form = document.getElementById('configForm');
            const params = new URLSearchParams(new FormData(form));
            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/otaclient.html');
            xhr.onload = function() {
                if (xhr.status === 200) {
                    ApplyCVT("/otaclient/info");
                    ApplyCVT("/otaclient/ver");
                }
            };
            xhr.send(params);
            return false;
        }

		function setMinMax() {
            const el = document.getElementById("otaclienttime");
            if (el.value != "") {
                if (parseInt(el.value) < parseInt(el.min)) {
                    el.value = el.min;
                }
                if (parseInt(el.value) > parseInt(el.max)) {
                    el.value = el.max;
                }
            }
        };
		</script>
</body>

</html>
